  "DATA COMPLETO:",
  JSON.stringify(data, null, 2)
);

if (!response.ok) {

  botMessage.textContent =
    "Erro API: " +
    (
      data.error?.message ||
      "desconhecido"
    );

  return;

}

if (
  !data.choices ||
  !data.choices[0]
) {

  botMessage.textContent =
    "Resposta inválida da IA.";

  return;

}

const answer =
  data
    .choices[0]
    .message
    .content;

console.log(
  "RESPOSTA ORIGINAL:",
  answer
);

/*
  Efeito de digitação
*/

await typeWriter(
  botMessage,
  answer,
  12
);

} catch (error) {

console.error(error);

botMessage.textContent =
  "Erro ao consultar a IA.";

} finally {

sendBtn.disabled = false;

questionInput.focus();

}

// =====================================================
// 2. NORMALIZAR TEXTO
// =====================================================

function normalize(text) {

return text
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "");

}

const normalizedPdf =
normalize(characterText);

const normalizedQuestion =
normalize(question);

// =====================================================
// 3. LOCALIZAR AS SEÇÕES
// =====================================================

const sectionPositions = [];

sections.forEach(section => {

const normalizedName =
  normalize(section.name);

const position =
  normalizedPdf.indexOf(normalizedName);

if (position !== -1) {

  sectionPositions.push({
    ...section,
    position
  });

}

});

// Ordena pela posição dentro do personagem

sectionPositions.sort(
(a, b) =>
a.position - b.position
);

// =====================================================
// 4. EXTRAIR O TEXTO DE CADA SEÇÃO
// =====================================================

const extractedSections =
sectionPositions.map(
(section, index) => {

    const start =
      section.position;

    const end =
      index + 1 <
      sectionPositions.length
        ? sectionPositions[index + 1].position
        : characterText.length;

    return {
      name: section.name,
      keywords: section.keywords,
      text: characterText.substring(
        start,
        end
      )
    };

  }
);

// =====================================================
// 5. CALCULAR QUAL SEÇÃO É MAIS RELEVANTE
// =====================================================

const scoredSections =
extractedSections.map(section => {

  let score = 0;

  const sectionText =
    normalize(section.text);

  section.keywords.forEach(keyword => {

    const normalizedKeyword =
      normalize(keyword);

    if (
      normalizedQuestion.includes(
        normalizedKeyword
      )
    ) {

      score += 5;

    }

    if (
      sectionText.includes(
        normalizedKeyword
      )
    ) {

      score += 1;

    }

  });

  // Também verifica palavras individuais
  const words =
    normalizedQuestion
      .split(/\s+/)
      .filter(word =>
        word.length >= 4
      );

  words.forEach(word => {

    if (
      sectionText.includes(word)
    ) {

      score += 1;

    }

  });

  return {
    ...section,
    score
  };

});

// =====================================================
// 6. ORDENAR POR RELEVÂNCIA
// =====================================================

scoredSections.sort(
(a, b) =>
b.score - a.score
);

// =====================================================
// 7. PEGAR AS MELHORES SEÇÕES
// =====================================================

const selectedSections =
scoredSections
.filter(section =>
section.score > 0
)
.slice(0, 3);

// =====================================================
// 8. SE NÃO ENCONTRAR NADA
// =====================================================

if (
selectedSections.length === 0
) {

return characterText.substring(
  0,
  3000
);

}

// =====================================================
// 9. MONTAR CONTEXTO
// =====================================================

return selectedSections
.map((section, index) => {

  return `

===== MEMÓRIA ${index + 1}: ${section.name} =====

${section.text.trim()}
`;

})
.join("\n\n");

}
