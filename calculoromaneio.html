 <body>

 <div class="container">


   <h2>Controle de peso / Romaneio</h2>

   <!-- LIMITES-->

 <!--

  <h4> Limites (%)</h4>

   Min (%): <input id="limMin" type="number" step="0.0001">

   Max (%): <input id="limMax" type="number" step="0.0001">

   Abaixo (%): <input id="limAbaixo" type="number" step="0.0001">

 -->

  <hr>


   <!--DADOS-->

   <h4>DADOS</h4>


   <div class="campo">

     <label for="a1">Peso Bruto:</label>

     <input id="a1" type="number" value="">

   </div>


   <div class="campo">

     <label for="b1">Tara:</label>

     <input id="b1" type="number" value="">

   </div>


   <div class="campo">

     <label for="d1">Romaneio:</label>

     <input id="d1" type="number" value="">

   </div>


   <button id="btnCalcular" class="btncalcular" type="button">Calcular</button>

  <!-- <button onclick="calcular()">Calcular</button> -->

 


  <hr>


  <table class="resultado">

   <tr>

      <th>Descricao</th>

      <th>Resultado</th>

   </tr>

   <tr>

      <td>Liquido:</td>

       <td id="c1"></td>

   </tr>

   <tr>

      <td>Romaneio:</td>

       <td id="d1romaneio"></td>

   </tr>

   <tr>

      <td>Diferenca(%):</td>

       <td id="e1"></td>

   </tr>

   <tr>

      <td>Porcentagem(%):</td>

      <td id="f1"></td>

   </tr>

   <tr>

      <td>Status:</td>

      <td id="g1"></td>

   </tr>

  </table>


</div>






<script>



document.getElementById("btnCalcular").onclick = function(){ calcular(); };



function calcular(){


 let A1 = Number(document.getElementById("a1").value);

 let B1 = Number(document.getElementById("b1").value);

 let D1 = Number(document.getElementById("d1").value);


 if (A1 ===  "" || B1 ===  "" || D1 ===  "") {


     alert("Existem campos vazios");

     return;

 }


 let C1 = A1 - B1;                  

 let E1 = C1 - D1;

 let F1 = (E1 / D1)*100;  


 let limMin = -3.50;

 let limMax =  1.50;

 let limAbaixo = -3.50;


 document.getElementById("c1").innerText = C1.toFixed(0);

 document.getElementById("d1romaneio").innerText = D1.toFixed(0);

 document.getElementById("e1").innerText = E1.toFixed(0);

 document.getElementById("f1").innerText = (F1).toFixed(2) + "%";




 let status = "";

 let classe = "";



 if (isNaN(F1)) {

    status = "";


    let g1 = document.getElementById("g1");

    g1.innerText = status;


 } else if (F1 > limMin && F1 < limMax){

    status = "OK";

    classe = "ok";


    let g1 = document.getElementById("g1");

    g1.innerText = status;

    g1.className = classe;


 } else if (F1 < limMin){

    status = "ABAIXO";

    classe = "abaixo";


    let g1 = document.getElementById("g1");

    g1.innerText = status;

    g1.className = classe;


 } else if (F1 > limMax){

    status = "ACIMA";

    classe = "acima";


    let g1 = document.getElementById("g1");

    g1.innerText = status;

    g1.className = classe;


 } else {

    status = "N OK";

    classe = "n ok";



    let g1 = document.getElementById("g1");

    g1.innerText = status;

    g1.className = classe;

 }


}


</script>
