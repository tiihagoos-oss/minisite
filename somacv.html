<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Cálculo dos Cavalos</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #eaeaea; font-family: Arial, sans-serif; padding: 15px; } .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); } h2 { margin-top: 0; font-size: 24px; text-align: center; } h4 { margin-top: 20px; margin-bottom: 15px; } hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; } .campo { margin-bottom: 15px; width: 100%; } .input-group { display: flex; gap: 15px; align-items: flex-start; } .input-group .campo { flex: 1; } label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 15px; } input { width: 100%; padding: 12px 10px; font-size: 17px; border-radius: 6px; border: 1px solid #ccc; outline: none; } input:focus { border-color: #2ecc71; box-shadow: 0 0 3px rgba(46, 204, 113, 0.4); } input[readonly] { background-color: #f2f2f2; cursor: not-allowed; font-weight: bold; } button { width: 100%; height: 55px; background-color: #2ecc71; color: white; font-size: 20px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; } button:hover { background-color: #27ae60; } button:active { transform: scale(0.99); } table.resultado { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 16px; } table.resultado th, table.resultado td { border: 1px solid #ccc; padding: 10px 8px; text-align: left; } table.resultado th { background: #f0f0f0; font-weight: bold; } table.resultado td:last-child { font-weight: bold; } .ok { color: green; font-weight: bold; } .acima { color: red; font-weight: bold; } .abaixo { color: red; font-weight: bold; } /* CELULAR */ @media (max-width: 600px) { body { padding: 10px; align-items: flex-start; } .container { margin-top: 10px; padding: 18px; border-radius: 8px; } h2 { font-size: 21px; line-height: 1.3; } .input-group { flex-direction: column; gap: 0; } .input-group .campo { width: 100%; } label { font-size: 14px; } input { padding: 13px 10px; font-size: 18px; } button { height: 58px; font-size: 20px; } table.resultado { font-size: 14px; } table.resultado th, table.resultado td { padding: 10px 7px; } table.resultado th:first-child, table.resultado td:first-child { width: 55%; } table.resultado th:last-child, table.resultado td:last-child { width: 45%; } } /* CELULARES MUITO PEQUENOS */ @media (max-width: 360px) { .container { padding: 14px; } h2 { font-size: 19px; } input { font-size: 16px; } button { font-size: 18px; } table.resultado { font-size: 13px; } } </style> </head> <body> <div class="container">
<h2>Controle de peso dos cavalos</h2>

<hr>

<h4>DADOS</h4>

<div class="input-group">

  <div class="campo">
    <label for="cav1">Cavalo de entrada:</label>
    <input id="cav1" type="number" inputmode="decimal">
  </div>

  <div class="campo">
    <label for="cav2">Cavalo de saída:</label>
    <input id="cav2" type="number" inputmode="decimal">
  </div>

</div>

<div class="input-group">

  <div class="campo">
    <label for="pesoCarreta">Peso (cavalo + carreta):</label>
    <input id="pesoCarreta" type="number" inputmode="decimal">
  </div>

  <div class="campo">
    <label for="a1">Peso Bruto:</label>
    <input id="a1" type="number" readonly>
  </div>

</div>

<div class="campo">
  <label for="b1">Tara:</label>
  <input id="b1" type="number" inputmode="decimal">
</div>

<div class="campo">
  <label for="d1">Romaneio:</label>
  <input id="d1" type="number" inputmode="decimal">
</div>

<button id="btnCalcular" type="button">
  Calcular
</button>

<hr>

<table class="resultado">

  <tr>
    <th>Descrição</th>
    <th>Resultado</th>
  </tr>

  <tr>
    <td>Líquido:</td>
    <td id="c1"></td>
  </tr>

  <tr>
    <td>Romaneio:</td>
    <td id="d1romaneio"></td>
  </tr>

  <tr>
    <td>Diferença:</td>
    <td id="e1"></td>
  </tr>

  <tr>
    <td>Porcentagem (%):</td>
    <td id="f1"></td>
  </tr>

  <tr>
    <td>Status:</td>
    <td id="g1"></td>
  </tr>

</table>

</div> <script> document .getElementById("btnCalcular") .addEventListener("click", calcular); function calcular() { const campos = [ "cav1", "cav2", "pesoCarreta", "b1", "d1" ]; for (let campo of campos) { if (document.getElementById(campo).value === "") { alert("Preencha todos os campos."); document.getElementById(campo).focus(); return; } } const cav1 = Number(document.getElementById("cav1").value); const cav2 = Number(document.getElementById("cav2").value); const pesoCarreta = Number(document.getElementById("pesoCarreta").value); const b1 = Number(document.getElementById("b1").value); const d1 = Number(document.getElementById("d1").value); const peso = pesoCarreta + cav1; const a1 = peso - cav2; document.getElementById("a1").value = a1.toFixed(2); const c1 = a1 - b1; const e1 = c1 - d1; const f1 = (e1 / d1) * 100; const limMin = -3.50; const limMax = 1.50; document.getElementById("c1").innerText = c1.toFixed(2); document.getElementById("d1romaneio").innerText = d1.toFixed(2); document.getElementById("e1").innerText = e1.toFixed(2); document.getElementById("f1").innerText = f1.toFixed(2) + "%"; let status = ""; let classe = ""; if (f1 >= limMin && f1 <= limMax) { status = "OK"; classe = "ok"; } else if (f1 < limMin) { status = "ABAIXO"; classe = "abaixo"; } else { status = "ACIMA"; classe = "acima"; } const g1 = document.getElementById("g1"); g1.innerText = status; g1.className = classe; } </script> </body> </html>
