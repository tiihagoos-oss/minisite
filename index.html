<style>

/* ==========================================================
   RESET
========================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #222;
    height: 100vh;
    overflow: hidden;
}

/* ==========================================================
   CHAT
========================================================== */

.chat {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ==========================================================
   CABEÇALHO
========================================================== */

.header {
    height: 68px;
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid #eeeeee;
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 20;
}

.header-content {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-spacer {
    flex: 1;
}

/* ==========================================================
   PERFIL
========================================================== */

.profile-photo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    opacity: 0.95;
    filter: brightness(1.05) saturate(0.9);
}

.profile-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.profile-name {
    font-size: 14px;
    font-weight: bold;
    color: #222;
}

.profile-status {
    font-size: 11px;
    color: #10a37f;
}

/* ==========================================================
   LOGIN / SIGN UP
========================================================== */

.auth-button {
    border: none;
    background: transparent;
    color: #222;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.auth-button:hover {
    background: #f1f1f1;
}

.signup-button {
    background: #222;
    color: #ffffff;
    margin-left: 4px;
}

.signup-button:hover {
    background: #000000;
}

/* ==========================================================
   MENU
========================================================== */

.menu-container {
    position: relative;
    margin-left: 6px;
}

.menu-button {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 22px;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.menu-button:hover {
    background: #f1f1f1;
}

.dropdown-menu {
    position: absolute;
    right: 0;
    top: 44px;
    width: 190px;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    display: none;
    z-index: 50;
}

.dropdown-menu.active {
    display: block;
}

.dropdown-item {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    color: #222;
    font-size: 13px;
    cursor: pointer;
}

.dropdown-item:hover {
    background: #f3f3f3;
}

/* ==========================================================
   ÁREA DAS MENSAGENS
========================================================== */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 100px 20px 160px;
    scroll-behavior: smooth;
}

.message {
    max-width: 760px;
    margin: 0 auto 28px;
    display: flex;
    gap: 16px;
    line-height: 1.6;
    font-size: 15px;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #10a37f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
}

.message.user {
    justify-content: flex-end;
}

.message.user .avatar {
    background: #444;
    order: 2;
}

.message-content {
    padding-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.user .message-content {
    order: 1;
    background: #f1f1f1;
    color: #222;
    padding: 10px 16px;
    border-radius: 18px;
    max-width: 70%;
    position: relative;
}

.message.user .message-content::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 13px;
    width: 10px;
    height: 10px;
    background: #f1f1f1;
    transform: rotate(45deg);
    border-radius: 2px;
}

.message:not(.user) .message-content {
    flex: 1;
}

/* ==========================================================
   ÁREA DE INPUT
========================================================== */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: linear-gradient(
        transparent,
        #ffffff 30%
    );
    z-index: 10;
}

.input-wrapper {
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #444;
    border-radius: 16px;
    min-height: 58px;
    display: flex;
    align-items: flex-end;
    padding: 10px 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #222;
    font-size: 15px;
    font-family: inherit;
    padding: 9px 8px;
    max-height: 180px;
    overflow-y: auto;
}

textarea::placeholder {
    color: #777;
}

.send-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #222;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
}

.send-button:hover {
    background: #ddd;
}

.send-button:active {
    transform: scale(0.94);
}

.send-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* ==========================================================
   STATUS DO PERSONAGEM
========================================================== */

.character-status {
    max-width: 760px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #888;
}

/* ==========================================================
   DISCLAIMER
========================================================== */

.disclaimer {
    max-width: 760px;
    margin: 8px auto 0;
    text-align: center;
    color: #888;
    font-size: 11px;
}

/* ==========================================================
   SCROLLBAR
========================================================== */

.messages::-webkit-scrollbar {
    width: 8px;
}

.messages::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 10px;
}

/* ==========================================================
   MOBILE
========================================================== */

const GROQ_API_KEY = "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";

/* ==========================================================

   ========================================================== */

const chat = document.getElementById("chat");
const status = document.getElementById("status");
const questionInput = document.getElementById("question");

/* ==========================================================
   CARREGAR PERSONAGEM
   ========================================================== */
let personagem = {};

async function carregarPersonagem() {
    try {
        const response = await fetch("./personagem.json");

        if (!response.ok) {
            throw new Error("Não foi possível carregar personagem.json");
        }

        personagem = await response.json();

        console.log("PERSONAGEM CARREGADO:", personagem);

        status.textContent = "Personagem carregado";

    } catch (error) {
        console.error("ERRO AO CARREGAR PERSONAGEM:", error);
        status.textContent = "Erro ao carregar personagem";
    }
}



/* ==========================================================
   ADICIONAR MENSAGEM
   ========================================================== */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message";

    if (type === "user") {

        message.classList.add("user");

    }

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        type === "user"
            ? "U"
            : "T";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent =
        text;

    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return content;

}


/* ==========================================================
   EFEITO DE DIGITAÇÃO
   ========================================================== */

async function typeWriter(
    element,
    text,
    speed = 12
) {

    element.textContent = "";

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        element.textContent +=
            text.charAt(i);

        chat.scrollTop =
            chat.scrollHeight;

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    speed
                )
        );

    }

}


/* ==========================================================
   ENVIAR PERGUNTA
   ========================================================== */

async function askQuestion() {

    const question = questionInput.value.trim();

    if (!question) return;

    sendBtn.disabled = true;

    addMessage(question, "user");

    questionInput.value = "";

    const botMessage = addMessage("Pensando...", "bot");

    try {

        const relevantText = getRelevantText(
            personagem,
            question
        );

        console.log("CONTEXTO ENVIADO:", relevantText);

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_API_KEY}`
                },

                body: JSON.stringify({

                    model: "openai/gpt-oss-20b",

                    messages: [

       {
    role: "system",
    content: `
Você é o Tiago Digital, uma versão virtual do Tiago.

Fale como se fosse o próprio Tiago.

O CONTEXTO SOBRE TIAGO contém informações sobre ele. Essas informações
devem ser usadas para responder às perguntas, mas NÃO devem ser todas
reveladas espontaneamente.

REGRAS:

1. Responda somente ao que foi perguntado.

2. Não forneça informações pessoais que não sejam relevantes para a
pergunta.

3. O fato de uma informação estar disponível no contexto NÃO significa
que ela deve ser mencionada.

4. Seja curto e direto. Normalmente responda em 1 a 3 frases.

5. Não faça introduções desnecessárias.

6. Não termine com frases como "se quiser saber mais, é só perguntar".

7. Não transforme informações simples em histórias.

8. Não invente detalhes que não estejam no contexto.

9. Não adicione sentimentos, experiências, hábitos ou comportamentos
que não estejam descritos no contexto.

10. Quando a pergunta for específica, responda especificamente.

11. Quando a pergunta pedir uma lista ou vários aspectos, forneça somente
os itens relevantes para aquela pergunta.

12. Informações mais pessoais ou específicas devem ser reveladas somente
quando forem diretamente perguntadas ou quando forem claramente
necessárias para responder.

13. Não mencione religião, relacionamentos, experiências pessoais,
objetivos ou outras informações sensíveis/pessoais sem que a pergunta
seja sobre esse assunto.

14. Não mencione o JSON, contexto, banco de dados ou sistema.

15. Quando uma informação não estiver disponível no contexto, diga que
não sabe. Não invente.

EXEMPLOS:

Pergunta:
"Você trabalha com o quê?"

Resposta:
"Sou desenvolvedor de software e empreendedor digital. Trabalho com
tecnologia, inteligência artificial, automação e desenvolvimento de sistemas."

NÃO acrescente hobbies, viagens, futebol, gatos ou outros assuntos.

Pergunta:
"Você gosta do que além de programar?"

Resposta:
"Gosto de videogames, gatos, viagens, natureza, praia, futebol,
caminhadas e andar de bicicleta."

NÃO invente histórias ou experiências sobre esses interesses.

Pergunta:
"Você tem alguma religião?"

Aí sim, consulte a informação de ESPIRITUALIDADE E RELIGIÃO e responda
sobre esse assunto.

CONTEXTO SOBRE TIAGO:

${relevantText}
`
},             
            
    

                        {
                            role: "user",
                            content: question
                        }

                    ]

                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error?.message ||
                "Erro desconhecido na API"
            );
        }

        const answer =
            data.choices?.[0]?.message?.content;

        if (!answer) {
            throw new Error(
                "A API não retornou uma resposta válida."
            );
        }

        await typeWriter(
            botMessage,
            answer,
            12
        );

    } catch (error) {

        console.error("ERRO:", error);

        botMessage.textContent =
            "Erro ao consultar a IA: " + error.message;

    } finally {

        sendBtn.disabled = false;

        questionInput.focus();
    }
}

questionInput.addEventListener(

            event.preventDefault();

            askQuestion();

);

/* ==========================================================
   NORMALIZAR TEXTO
========================================================== */

function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* ==========================================================
   ENCONTRAR CONTEXTOS RELEVANTES
========================================================== */

function getRelevantText(personagem, pergunta) {

    if (!personagem || !pergunta) {
        return "";
    }

    const perguntaNormalizada =
        normalizar(pergunta);

    const resultados = [];

    for (const [titulo, conteudo] of Object.entries(personagem)) {

        const chaves =
            palavrasChave[titulo] || [];

        let pontos = 0;

        for (const palavraChave of chaves) {

            const chaveNormalizada =
                normalizar(palavraChave);

            if (
                perguntaNormalizada
                    .includes(chaveNormalizada)
            ) {

                pontos += 10;

            }

        }

        /* Também considera o próprio título da seção */

        const tituloNormalizado =
            normalizar(titulo);

        if (
            perguntaNormalizada
                .includes(tituloNormalizado)
        ) {

            pontos += 20;

        }

        if (pontos > 0) {

            resultados.push({
                titulo,
                conteudo,
                pontos
            });

        }

    }


    /* ======================================================
       ORDENA PELOS CONTEXTOS MAIS RELEVANTES
    ====================================================== */

    resultados.sort(
        (a, b) => b.pontos - a.pontos
    );


    /* ======================================================
       ENVIA SOMENTE OS MELHORES CONTEXTOS
    ====================================================== */

    return resultados
        .slice(0, 3)
        .map(secao =>
            `### ${secao.titulo}\n${secao.conteudo}`
        )
        .join("\n\n");

}
