<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tiago Digital</title>

<style>

/* ==========================================================
   RESET
========================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #222;
    height: 100vh;
    overflow: hidden;
}

/* ==========================================================
   CHAT
========================================================== */

.chat {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ==========================================================
   CABEÇALHO
========================================================== */

.header {
    height: 68px;
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid #eeeeee;
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 20;
}

.header-content {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-spacer {
    flex: 1;
}

/* ==========================================================
   PERFIL
========================================================== */

.profile-photo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    opacity: 0.95;
    filter: brightness(1.05) saturate(0.9);
}

.profile-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.profile-name {
    font-size: 14px;
    font-weight: bold;
    color: #222;
}

.profile-status {
    font-size: 11px;
    color: #10a37f;
}

/* ==========================================================
   LOGIN / SIGN UP
========================================================== */

.auth-button {
    border: none;
    background: transparent;
    color: #222;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.auth-button:hover {
    background: #f1f1f1;
}

.signup-button {
    background: #222;
    color: #ffffff;
    margin-left: 4px;
}

.signup-button:hover {
    background: #000000;
}

/* ==========================================================
   MENU
========================================================== */

.menu-container {
    position: relative;
    margin-left: 6px;
}

.menu-button {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 22px;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.menu-button:hover {
    background: #f1f1f1;
}

.dropdown-menu {
    position: absolute;
    right: 0;
    top: 44px;
    width: 190px;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    display: none;
    z-index: 50;
}

.dropdown-menu.active {
    display: block;
}

.dropdown-item {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    color: #222;
    font-size: 13px;
    cursor: pointer;
}

.dropdown-item:hover {
    background: #f3f3f3;
}

/* ==========================================================
   ÁREA DAS MENSAGENS
========================================================== */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 100px 20px 160px;
    scroll-behavior: smooth;
}

.message {
    max-width: 760px;
    margin: 0 auto 28px;
    display: flex;
    gap: 16px;
    line-height: 1.6;
    font-size: 15px;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #10a37f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
}

.message.user {
    justify-content: flex-end;
}

.message.user .avatar {
    background: #444;
    order: 2;
}

.message-content {
    padding-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.user .message-content {
    order: 1;
    background: #f1f1f1;
    color: #222;
    padding: 10px 16px;
    border-radius: 18px;
    max-width: 70%;
    position: relative;
}

.message.user .message-content::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 13px;
    width: 10px;
    height: 10px;
    background: #f1f1f1;
    transform: rotate(45deg);
    border-radius: 2px;
}

.message:not(.user) .message-content {
    flex: 1;
}

/* ==========================================================
   ÁREA DE INPUT
========================================================== */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: linear-gradient(
        transparent,
        #ffffff 30%
    );
    z-index: 10;
}

.input-wrapper {
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #444;
    border-radius: 16px;
    min-height: 58px;
    display: flex;
    align-items: flex-end;
    padding: 10px 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #222;
    font-size: 15px;
    font-family: inherit;
    padding: 9px 8px;
    max-height: 180px;
    overflow-y: auto;
}

textarea::placeholder {
    color: #777;
}

.send-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #222;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
}

.send-button:hover {
    background: #ddd;
}

.send-button:active {
    transform: scale(0.94);
}

.send-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* ==========================================================
   STATUS DO PERSONAGEM
========================================================== */

.character-status {
    max-width: 760px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #888;
}

/* ==========================================================
   DISCLAIMER
========================================================== */

.disclaimer {
    max-width: 760px;
    margin: 8px auto 0;
    text-align: center;
    color: #888;
    font-size: 11px;
}

/* ==========================================================
   SCROLLBAR
========================================================== */

.messages::-webkit-scrollbar {
    width: 8px;
}

.messages::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 10px;
}

/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

    .header {
        height: 62px;
        padding: 0 10px;
    }

    .header-content {
        gap: 8px;
    }

    .profile-photo {
        width: 36px;
        height: 36px;
    }

    .profile-name {
        font-size: 13px;
    }

    .profile-status {
        font-size: 10px;
    }

    .auth-button {
        font-size: 12px;
        padding: 8px 7px;
    }

    .signup-button {
        margin-left: 0;
    }

    .menu-container {
        margin-left: 0;
    }

    .menu-button {
        width: 34px;
        height: 34px;
    }

    .dropdown-menu {
        right: 0;
        width: 180px;
    }

    .messages {
        padding:
            82px 10px 155px;
    }

    .message {
        gap: 9px;
        margin-bottom: 22px;
        font-size: 14px;
        line-height: 1.5;
    }

    .avatar {
        width: 30px;
        height: 30px;
        font-size: 13px;
    }

    .message.user .message-content {
        max-width: 80%;
        padding: 9px 13px;
        border-radius: 16px;
    }

    .input-area {
        padding: 8px 10px 10px;
    }

    .input-wrapper {
        min-height: 54px;
        border-radius: 14px;
        padding: 8px 9px;
    }

    textarea {
        font-size: 15px;
        padding: 8px 6px;
    }

    .send-button {
        width: 36px;
        height: 36px;
    }

    .character-status {
        padding: 0 5px;
        font-size: 10px;
    }

    .disclaimer {
        font-size: 9px;
        margin-top: 6px;
    }
}

/* ==========================================================
   TELAS MUITO PEQUENAS
========================================================== */

@media (max-width: 380px) {

    .auth-button {
        font-size: 11px;
        padding: 7px 5px;
    }

    .profile-info {
        gap: 1px;
    }

    .message.user .message-content {
        max-width: 84%;
    }

}

</style>

</head>

<body>

<main class="chat">

<!-- ======================================================
     CABEÇALHO
====================================================== -->

<header class="header">

    <div class="header-content">

        <img
            class="profile-photo"
            src="https://i.pravatar.cc/100?img=12"
            alt="Foto de perfil"
        >

        <div class="profile-info">

            <div class="profile-name">
                Tiago
            </div>

            <div class="profile-status">
                ● Online
            </div>

        </div>

        <div class="header-spacer"></div>

        <button
            type="button"
            class="auth-button"
            id="loginButton"
        >
            Login
        </button>

        <button
            type="button"
            class="auth-button signup-button"
            id="signupButton"
        >
            Sign Up
        </button>

        <div class="menu-container">

            <button
                type="button"
                class="menu-button"
                id="menuButton"
                aria-label="Abrir menu"
            >
                ⋮
            </button>

            <div
                class="dropdown-menu"
                id="dropdownMenu"
            >

                <button
                    type="button"
                    class="dropdown-item"
                >
                    ⚙ Configurações
                </button>

                <button
                    type="button"
                    class="dropdown-item"
                >
                    🔒 Privacidade
                </button>

                <button
                    type="button"
                    class="dropdown-item"
                >
                    ❓ Ajuda
                </button>

            </div>

        </div>

    </div>

</header>


<!-- ======================================================
     MENSAGENS
====================================================== -->

<div
    class="messages"
    id="chat"
>

    <div class="message">

        <div class="avatar">
            T
        </div>

        <div class="message-content">
            Oi! Eu sou o Tiago digital. Como posso ajudar?
        </div>

    </div>

</div>


<!-- ======================================================
     ÁREA INFERIOR
====================================================== -->

<div class="input-area">

    <div class="character-status">

        <div id="status">
            Carregando personagem...
        </div>

    </div>


    <div class="input-wrapper">

        <textarea
            id="question"
            rows="1"
            placeholder="Digite uma mensagem..."
        ></textarea>

        <button
            class="send-button"
            id="sendBtn"
            type="button"
            title="Enviar"
        >
            ↑
        </button>

    </div>


    <div class="disclaimer">
        A IA pode cometer erros. Verifique informações importantes.
    </div>

</div>

</main>




<script>

/* ==========================================================
   CONFIGURAÇÕES
   ========================================================== */

/*
   ATENÇÃO:
   Isto é apenas para TESTE.

   NÃO deixe sua chave Groq definitiva dentro do index.html.
   Depois vamos colocar a chave no backend.
*/

const GROQ_API_KEY = "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";

let characterText = "";


/* ==========================================================
   ELEMENTOS
   ========================================================== */

const chat = document.getElementById("chat");
const status = document.getElementById("status");
const questionInput = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");


/* ==========================================================
   CARREGAR PERSONAGEM
   ========================================================== */

async function carregarPersonagem() {

    try {

        const response =
            await fetch("/personagem.json");

        if (!response.ok) {

            throw new Error(
                "Não foi possível carregar personagem.json"
            );

        }

        const personagem =
            await response.json();

        /*
           Se personagem.json for um objeto,
           transformamos em texto.
        */

        characterText =
            JSON.stringify(
                personagem,
                null,
                2
            );

        console.log(
            "PERSONAGEM CARREGADO:",
            personagem
        );

        status.textContent =
            "Personagem carregado";

    } catch (error) {

        console.error(
            "ERRO AO CARREGAR PERSONAGEM:",
            error
        );

        status.textContent =
            "Erro ao carregar personagem";

    }

}


/* ==========================================================
   ADICIONAR MENSAGEM
   ========================================================== */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message";

    if (type === "user") {

        message.classList.add("user");

    }

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        type === "user"
            ? "U"
            : "T";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent =
        text;

    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return content;

}


/* ==========================================================
   EFEITO DE DIGITAÇÃO
   ========================================================== */

async function typeWriter(
    element,
    text,
    speed = 12
) {

    element.textContent = "";

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        element.textContent +=
            text.charAt(i);

        chat.scrollTop =
            chat.scrollHeight;

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    speed
                )
        );

    }

}


/* ==========================================================
   ENVIAR PERGUNTA
   ========================================================== */

async function askQuestion() {

    const question =
        questionInput.value.trim();

    if (!question) {

        return;

    }

    console.log(
        "PERGUNTA:",
        question
    );


    /* Desabilita botão */

    sendBtn.disabled = true;


    /* Mostra pergunta do usuário */

    addMessage(
        question,
        "user"
    );


    /* Limpa campo */

    questionInput.value = "";

    questionInput.style.height =
        "auto";


    /* Mensagem provisória da IA */

    const botMessage =
        addMessage(
            "Pensando...",
            "bot"
        );


    try {

        /*
           Procura os trechos relevantes
           do personagem.
        */

        const relevantText =
            getRelevantText(
                characterText,
                question
            );


        console.log(
            "CONTEXTO ENVIADO:",
            relevantText
        );


        /* ==================================================
           CHAMADA GROQ
           ================================================== */

        const response =
            await fetch(
                "https://api.groq.com/openai/v1/chat/completions",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${GROQ_API_KEY}`

                    },

                    body:
                        JSON.stringify({

                            model:
                                "openai/gpt-oss-20b",

                            messages: [

                                {
                                    role: "system",

                                    content: `

Você é o Tiago Digital, uma versão virtual do Tiago real.

Fale em primeira pessoa quando estiver falando sobre Tiago.

PERSONALIDADE:

- informal
- curioso
- interessado em tecnologia e inteligência artificial
- desenvolvedor de software
- empreendedor digital
- interessado em automação
- fã de videogames
- torce para o SPFC
- gosta de gatos
- gosta de viagens
- gosta de natureza e praia
- gosta de caminhadas
- gosta de andar de bicicleta
- não gosta de lugares cheios

REGRAS:

Seja natural e espontâneo.

Não invente fatos sobre a vida do Tiago.

Não crie memórias falsas.

Não transforme hipóteses em fatos.

Quando não souber alguma informação pessoal, diga naturalmente que não tem essa informação confirmada.

Responda de maneira proporcional à pergunta.

Perguntas simples devem receber respostas simples.

Perguntas complexas podem receber respostas mais completas.

Não fique repetindo sua apresentação.

CONTEXTO SOBRE TIAGO:

${relevantText}

`
                                },

                                {
                                    role: "user",

                                    content:
                                        question
                                }

                            ]

                        })

                }
            );


        /* ==================================================
           LER RESPOSTA
           ================================================== */

        const data =
            await response.json();


        console.log(
            "STATUS:",
            response.status
        );

        console.log(
            "RESPOSTA COMPLETA:",
            data
        );


        /* ==================================================
           VERIFICAR ERRO
           ================================================== */

        if (!response.ok) {

            throw new Error(
                data.error?.message ||
                "Erro desconhecido na API"
            );

        }


        /* ==================================================
           PEGAR RESPOSTA
           ================================================== */

        if (
            !data.choices ||
            !data.choices[0] ||
            !data.choices[0].message
        ) {

            throw new Error(
                "A API retornou uma resposta inválida."
            );

        }


        const answer =
            data.choices[0].message.content;


        console.log(
            "RESPOSTA DA IA:",
            answer
        );


        /* ==================================================
           DIGITAR RESPOSTA
           ================================================== */

        await typeWriter(
            botMessage,
            answer,
            12
        );


    } catch (error) {

        console.error(
            "ERRO:",
            error
        );

        botMessage.textContent =
            "Erro ao consultar a IA: " +
            error.message;


    } finally {

        sendBtn.disabled = false;

        questionInput.focus();

    }

}


/* ==========================================================
   BOTÃO ENVIAR
   ========================================================== */

sendBtn.addEventListener(
    "click",
    askQuestion
);


/* ==========================================================
   ENTER PARA ENVIAR
   ========================================================== */

questionInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            askQuestion();

        }

    }
);


/* ==========================================================
   AUTO RESIZE
   ========================================================== */

questionInput.addEventListener(
    "input",
    () => {

        questionInput.style.height =
            "auto";

        questionInput.style.height =
            Math.min(
                questionInput.scrollHeight,
                180
            ) + "px";

    }
);


/* ==========================================================
   MENU
   ========================================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const dropdownMenu =
    document.getElementById(
        "dropdownMenu"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const signupButton =
    document.getElementById(
        "signupButton"
    );


menuButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        dropdownMenu.classList.toggle(
            "active"
        );

    }
);


document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(
                ".menu-container"
            )
        ) {

            dropdownMenu.classList.remove(
                "active"
            );

        }

    }
);


loginButton.addEventListener(
    "click",
    () => {

        alert(
            "Abrir tela de Login"
        );

    }
);


signupButton.addEventListener(
    "click",
    () => {

        alert(
            "Abrir tela de cadastro"
        );

    }
);


/* ==========================================================
   ENCONTRAR TRECHOS RELEVANTES
   ========================================================== */

function getRelevantText(
    characterText,
    question
) {

    if (
        !characterText ||
        !question
    ) {

        return "";

    }


    function normalize(text) {

        return text
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            );

    }


    const normalizedText =
        normalize(characterText);

    const normalizedQuestion =
        normalize(question);


    /*
       Por enquanto usamos palavras da pergunta
       para encontrar partes relevantes.
    */

    const words =
        normalizedQuestion
            .split(/\s+/)
            .filter(
                word =>
                    word.length >= 4
            );


    const lines =
        characterText.split("\n");


    const relevantLines = [];


    for (
        const line of lines
    ) {

        const normalizedLine =
            normalize(line);


        for (
            const word of words
        ) {

            if (
                normalizedLine.includes(
                    word
                )
            ) {

                relevantLines.push(
                    line
                );

                break;

            }

        }

    }


    /*
       Limita o contexto enviado
       para evitar mandar o arquivo inteiro.
    */

    if (
        relevantLines.length === 0
    ) {

        return characterText.substring(
            0,
            4000
        );

    }


    return relevantLines
        .slice(0, 30)
        .join("\n");

}


/* ==========================================================
   INICIAR
   ========================================================== */

carregarPersonagem();

</script>

      


            

</body>

</html>
