/* ==========================================================
   ADICIONAR MENSAGEM AO CHAT
========================================================== */

function addMessage(
    role,
    content
) {

    const mensagem =
        document.createElement("div");


    mensagem.className =
        "mensagem " +
        (
            role === "user"
                ? "usuario"
                : "assistente"
        );


    const bolha =
        document.createElement("div");


    bolha.className =
        "bolha";


    bolha.textContent =
        content;


    mensagem.appendChild(
        bolha
    );


    chat.appendChild(
        mensagem
    );


    chat.scrollTop =
        chat.scrollHeight;


    return bolha;

}



/* ==========================================================
   EFEITO DE DIGITAÇÃO
========================================================== */

async function typeWriter(
    element,
    text
) {

    element.textContent = "";


    for (
        const caractere of text
    ) {

        element.textContent +=
            caractere;


        chat.scrollTop =
            chat.scrollHeight;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    8
                )
        );

    }

}



/* ==========================================================
   NORMALIZAR TEXTO
========================================================== */

function normalizar(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .trim();

}

/* ==========================================================
   BUSCAR CONTEÚDO MAIS RELEVANTE
========================================================== */

function getRelevantText(personagemAtual, pergunta) {

    if (
        !personagemAtual ||
        Object.keys(personagemAtual).length === 0
    ) {
        return "";
    }

    const texto = normalizar(pergunta);

    const resultados = [];

    for (const categoria of palavrasChave) {

        if (!personagemAtual[categoria.name]) {
            continue;
        }

        let pontos = 0;

        for (const palavraOriginal of categoria.keywords) {

            const palavra = normalizar(palavraOriginal);

            if (!palavra) {
                continue;
            }

            /*
             * Palavras/frases mais específicas recebem
             * mais pontos.
             */
            if (texto.includes(palavra)) {

                if (palavra.length >= 15) {
                    pontos += 25;
                }
                else if (palavra.length >= 8) {
                    pontos += 15;
                }
                else {
                    pontos += 10;
                }
            }
        }

        /*
         * Se o próprio nome da categoria aparece
         * na pergunta, damos um peso maior.
         */
        const nomeCategoria = normalizar(categoria.name);

        if (
            nomeCategoria.length > 3 &&
            texto.includes(nomeCategoria)
        ) {
            pontos += 20;
        }

        if (pontos > 0) {

            resultados.push({
                titulo: categoria.name,
                conteudo: personagemAtual[categoria.name],
                pontos: pontos
            });
        }
    }


    /* ======================================================
       ORDENA PELO MAIOR NÚMERO DE PONTOS
    ====================================================== */

    resultados.sort((a, b) => b.pontos - a.pontos);


    /* ======================================================
       SE ENCONTROU ASSUNTOS
    ====================================================== */


    if (resultados.length > 0) {

        /*
         * Pegamos no máximo 3 categorias.
         *
         * Assim uma pergunta simples não manda
         * o personagem inteiro para o Groq.
         */
        const selecionados = resultados.slice(0, 3);

        return selecionados
            .map(item =>
                `### ${item.titulo}\n\n${item.conteudo}`
            )
            .join("\n\n");
    }


    /* ======================================================
       FALLBACK
       
       Se nenhuma palavra foi encontrada, NÃO manda
       o personagem inteiro.
       
       Usa apenas o RESUMO.
    ====================================================== */

    if (personagemAtual.RESUMO) {

        return `
### RESUMO

${personagemAtual.RESUMO}
`.trim();
    }


    /*
     * Último fallback caso nem RESUMO exista.
     */
    return "";
}


/* ==========================================================

========================================================== */

function criarPromptSistema(
    relevantText,
    contextoConversa
) {

    return `

Você é o Tiago Digital, uma representação virtual
do Tiago descrito nos dados do personagem.

==================================================
IDENTIDADE
==================================================

Você deve falar em primeira pessoa quando estiver
falando sobre Tiago.

Nome completo: Tiago Silva.

Nome: Tiago.

Idade: 37 anos.

Nascido em Campinas, São Paulo.

Mora em Americana, São Paulo.

Brasileiro.

Heterosexual.

Estado civil: solteiro.

As informações pessoais do Tiago devem vir dos dados
do personagem fornecidos abaixo.

Não invente fatos pessoais.

Não invente memórias.

Não invente experiências.

Não invente opiniões pessoais.

Não atribua ao Tiago algo que não esteja nos dados
do personagem ou na memória da conversa.

==================================================
FORMA DE CONVERSAR
==================================================

Seja natural, informal e conversacional.

Responda diretamente ao que o usuário perguntou.

Não fique repetindo quem você é.

Não comece todas as respostas com "Eu sou Tiago".

Não transforme uma conversa simples em uma resposta
excessivamente formal ou técnica.

Use o contexto da conversa para compreender frases
como "isso", "aquilo", "ele", "antes", "depois",
"também", "e sobre aquilo?" etc.

==================================================
QUANDO NÃO QUISER RESPONDER
==================================================

Se uma pergunta envolver alguma informação pessoal
que Tiago prefira não responder, não invente.

Também não responda de maneira robótica dizendo:

"Não possuo informações suficientes."

"Não tenho conhecimento suficiente."

"Não tenho informações sobre isso."

Prefira uma resposta natural indicando que é algo
que ele prefere não comentar.

Exemplos:

"Essa é uma parte que eu prefiro não comentar."

"Sobre isso eu prefiro não entrar em detalhes."

"Essa é uma coisa que eu prefiro deixar em privado."

Não invente uma resposta somente para preencher
uma informação que não está disponível.

==================================================
HIERARQUIA
==================================================

Prioridade das informações:

1. Contexto específico do personagem.
2. Memória da conversa.
3. Conhecimento geral.

Quando estiver falando sobre a vida pessoal de Tiago,
priorize os dados específicos do personagem.

Não contradiga informações fornecidas pelo personagem.

==================================================
CONTEXTO DO PERSONAGEM
==================================================

${relevantText || "(Nenhuma informação específica encontrada.)"}

==================================================
MEMÓRIA DA CONVERSA
==================================================

${contextoConversa || "(A conversa está começando agora.)"}

==================================================
REGRAS FINAIS
==================================================

Não invente fatos pessoais.

Não invente memórias.

Não diga que lembra de algo se isso não estiver
presente na memória fornecida.

Use as informações acima naturalmente.

Responda sempre em português do Brasil.

`.trim();

}



/* ==========================================================
   FAZER PERGUNTA
========================================================== */

async function askQuestion() {


    const question =
        questionInput.value.trim();


    if (!question) {

        return;

    }


    /*
        Verifica se a chave foi configurada.
    */

    if (
        !GROQ_API_KEY ||
        GROQ_API_KEY ===
        "COLOQUE_SUA_NOVA_CHAVE_AQUI"
    ) {

        addMessage(
            "assistant",

            "Configure uma nova chave da Groq no código antes de usar o chatbot."
        );

        return;

    }


    /*
        Verifica memória.
    */

    if (!memoriaConversa) {

        addMessage(
            "assistant",

            "Erro: memoria.js não foi carregado."
        );

        return;

    }


    /*
        Desabilita interface.
    */

    sendBtn.disabled =
        true;


    questionInput.disabled =
        true;


    status.textContent =
        "Pensando...";


    const pergunta =
        question;


    questionInput.value =
        "";


    /*
        Mostra mensagem do usuário.
    */

    addMessage(
        "user",
        pergunta
    );


    /*
        ======================================================
        PRIMEIRO:
        adiciona a pergunta à memória.
        ======================================================
    */

      

      /*
    memoriaConversa.adicionarMensagem(
        "user",
        pergunta
    );
      */

      

    /*
        ======================================================
        SEGUNDO:
        encontra as informações relevantes
        no personagem.json.
        ======================================================
    */

    const relevantText =
        getRelevantText(
            personagem,
            pergunta
        );


    /*
        ======================================================
        TERCEIRO:
        pega a memória da conversa.
        ======================================================
    */

    const contextoConversa =
        memoriaConversa.obterContexto();


    /*
        DEBUG
    */

    console.log(
        "======================================"
    );

    console.log(
        "PERGUNTA:"
    );

    console.log(
        pergunta
    );


    console.log(
        "======================================"
    );

    console.log(
        "PERSONAGEM ENVIADO:"
    );

    console.log(
        relevantText
    );


    console.log(
        "======================================"
    );

    console.log(
        "MEMÓRIA ENVIADA:"
    );

    console.log(
        contextoConversa
    );


    console.log(
        "======================================"
    );


    /*
        Cria prompt.
    */

    const promptSistema =
        criarPromptSistema(
            relevantText,
            contextoConversa
        );


    try {


        /*
            ==================================================
            CHAMADA GROQ
            ==================================================
        */

        const response =
            await fetch(

                "https://api.groq.com/openai/v1/chat/completions",

                {

                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${GROQ_API_KEY}`

                    },


                    body:
                        JSON.stringify({

                            model:
                                GROQ_MODEL,


                            messages: [

                                {
                                    role:
                                        "system",

                                    content:
                                        promptSistema
                                },


                                {
                                    role:
                                        "user",

                                    content:
                                        pergunta
                                }

                            ],


                            temperature:
                                0.7

                        })

                }

            );


        /*
            Lê resposta.
        */

        const data =
            await response.json();


        /*
            Verifica erro.
        */

        if (
            !response.ok
        ) {

            throw new Error(

                data.error?.message ||
                `Erro da API: ${response.status}`

            );

        }


        /*
            Pega resposta.
        */

        const answer =
            data
                .choices?.[0]
                ?.message
                ?.content;


        if (!answer) {

            throw new Error(
                "A API não retornou uma resposta."
            );

        }


        /*
            ==================================================
            MOSTRA RESPOSTA
            ==================================================
        */

        const bolha =
            addMessage(
                "assistant",
                ""
            );


        await typeWriter(
            bolha,
            answer.trim()
        );


        /*
            ==================================================
            SALVA RESPOSTA NA MEMÓRIA
            ==================================================
        */

        memoriaConversa.adicionarMensagem(
            "assistant",
            answer.trim()
        );


        /*
            ==================================================
            RESUMO DA MEMÓRIA
            ==================================================

            memoria.js decide quando precisa resumir.
        */

        if (
            memoriaConversa.precisaResumir()
        ) {

            try {

                await memoriaConversa.gerarResumo(

                    GROQ_API_KEY,

                    GROQ_MODEL

                );

            } catch (
                erroMemoria
            ) {

                console.error(
                    "Erro ao gerar resumo da memória:",
                    erroMemoria
                );

            }

        }


        status.textContent =
            "Personagem carregado";


    } catch (
        error
    ) {


        console.error(
            "ERRO AO CONSULTAR GROQ:",
            error
        );


        addMessage(

            "assistant",

            "Erro ao consultar a IA: " +
            error.message

        );


        status.textContent =
            "Erro";

    }


    /*
        Reativa interface.
    */

    sendBtn.disabled =
        false;


    questionInput.disabled =
        false;


    questionInput.focus();

}



/* ==========================================================
   BOTÃO ENVIAR
========================================================== */

sendBtn.addEventListener(

    "click",

    askQuestion

);



/* ==========================================================
   ENTER
========================================================== */

questionInput.addEventListener(

    "keydown",

    event => {


        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();


            askQuestion();

        }

    }

);
