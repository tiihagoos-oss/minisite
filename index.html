/* ==========================================================
   RESET
========================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ==========================================================
   BODY
========================================================== */

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
}


/* ==========================================================
   HEADER
========================================================== */

header {
    background: #111827;
    color: white;
    padding: 14px 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}


.perfil {
    display: flex;
    align-items: center;
    gap: 12px;
}


.perfil img {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    object-fit: cover;
}


.nome {
    font-size: 18px;
    font-weight: bold;
}


.online {
    font-size: 12px;
    color: #4ade80;
    margin-top: 2px;
}


.menu {
    display: flex;
    gap: 8px;
}


.menu button {
    border: none;
    background: transparent;
    color: white;

    cursor: pointer;

    padding: 8px;
}


/* ==========================================================
   CONTAINER
========================================================== */

.container {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    min-height: calc(100vh - 74px);

    display: flex;
    flex-direction: column;
}


/* ==========================================================
   CHAT
========================================================== */

#chat {
    flex: 1;

    padding: 20px;

    overflow-y: auto;
}


.mensagem {
    margin-bottom: 14px;

    display: flex;
}


.mensagem.usuario {
    justify-content: flex-end;
}


.bolha {
    max-width: 82%;

    padding: 12px 15px;

    border-radius: 16px;

    line-height: 1.5;

    white-space: pre-wrap;

    word-wrap: break-word;
}


.usuario .bolha {
    background: #2563eb;
    color: white;

    border-bottom-right-radius: 4px;
}


.assistente .bolha {
    background: white;

    border: 1px solid #ddd;

    border-bottom-left-radius: 4px;
}


/* ==========================================================
   STATUS
========================================================== */

#status {
    padding: 8px 18px;

    font-size: 12px;

    color: #666;

    text-align: center;
}


/* ==========================================================
   AVISO
========================================================== */

.aviso {
    font-size: 11px;

    color: #777;

    text-align: center;

    padding: 7px 15px;
}


/* ==========================================================
   INPUT
========================================================== */

.input-area {
    padding: 12px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;

    gap: 10px;

    position: sticky;

    bottom: 0;
}


#question {
    flex: 1;

    resize: none;

    border: 1px solid #ccc;

    border-radius: 12px;

    padding: 12px;

    min-height: 48px;

    max-height: 140px;

    font-family: inherit;

    font-size: 15px;

    outline: none;
}


#question:focus {
    border-color: #2563eb;
}


#sendBtn {
    border: none;

    border-radius: 12px;

    background: #2563eb;

    color: white;

    padding: 0 20px;

    cursor: pointer;

    font-weight: bold;
}


#sendBtn:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}


/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

    .bolha {
        max-width: 90%;
    }

    .input-area {
        padding: 8px;
    }

    #sendBtn {
        padding: 0 15px;
    }

/* ==========================================================
   ADICIONAR MENSAGEM
========================================================== */

function addMessage(
    role,
    content
) {

    const mensagem =
        document.createElement("div");

    mensagem.className =
        "mensagem " +
        (
            role === "user"
                ? "usuario"
                : "assistente"
        );

    const bolha =
        document.createElement("div");

    bolha.className =
        "bolha";

    bolha.textContent =
        content;

    mensagem.appendChild(
        bolha
    );

    chat.appendChild(
        mensagem
    );

    chat.scrollTop =
        chat.scrollHeight;

    return bolha;

}


/* ==========================================================
   EFEITO DE DIGITAÇÃO
========================================================== */

async function typeWriter(
    element,
    text
) {

    element.textContent = "";

    for (
        const caractere of text
    ) {

        element.textContent +=
            caractere;

        chat.scrollTop =
            chat.scrollHeight;

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    8
                )
        );

    }

}


/* ==========================================================
   NORMALIZAR
========================================================== */

function normalizar(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }

    return String(texto)

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .trim();

}

/* ==========================================================
   ENCONTRAR TEXTO RELEVANTE
========================================================== */

function getRelevantText(
    personagemAtual,
    pergunta
) {

    if (
        !personagemAtual ||
        !pergunta
    ) {

        return "";

    }

    const perguntaNormalizada =
        normalizar(
            pergunta
        );

    const resultados = [];


    for (
        const [
            titulo,
            conteudo
        ]
        of Object.entries(
            personagemAtual
        )
    ) {

        const secao =
            palavrasChave.find(
                item =>
                    normalizar(
                        item.name
                    ) ===
                    normalizar(
                        titulo
                    )
            );

        const chaves =
            secao
                ? secao.keywords
                : [];

        let pontos = 0;


        for (
            const palavraChave
            of chaves
        ) {

            const chaveNormalizada =
                normalizar(
                    palavraChave
                );

            if (
                chaveNormalizada &&
                perguntaNormalizada.includes(
                    chaveNormalizada
                )
            ) {

                pontos += 10;

            }

        }


        const tituloNormalizado =
            normalizar(
                titulo
            );


        if (
            tituloNormalizado &&
            perguntaNormalizada.includes(
                tituloNormalizado
            )
        ) {

            pontos += 20;

        }


        if (pontos > 0) {

            resultados.push({

                titulo:
                    titulo,

                conteudo:
                    conteudo,

                pontos:
                    pontos

            });

        }

    }


    resultados.sort(
        (
            a,
            b
        ) =>
            b.pontos -
            a.pontos
    );


    if (
        resultados.length > 0
    ) {

        return resultados

            .slice(0, 2)

            .map(
                secao => {

                    let conteudo;

                    if (
                        typeof secao.conteudo ===
                        "string"
                    ) {

                        conteudo =
                            secao.conteudo;

                    } else {

                        conteudo =
                            JSON.stringify(
                                secao.conteudo
                            );

                    }


                    /*
                        Limita o tamanho de cada
                        seção enviada para a API.
                    */

                    if (
                        conteudo.length > 3500
                    ) {

                        conteudo =
                            conteudo.substring(
                                0,
                                3500
                            );

                    }


                    return (
                        "### " +
                        secao.titulo +
                        "\n" +
                        conteudo
                    );

                }
            )

            .join(
                "\n\n"
            );

    }


    /*
        Se não encontrou uma seção específica,
        NÃO envia o personagem inteiro.

        Isso reduz bastante o consumo de tokens.
    */

    return "";

}


/* ==========================================================
   PROMPT DO SISTEMA
========================================================== */

function criarPromptSistema(
    relevantText,
    contextoConversa
) {

    return `Você é o Tiago Digital, uma representação
virtual do Tiago.

Fale em primeira pessoa quando falar sobre Tiago.

Seja natural, informal e direto.

Não invente fatos, memórias, experiências ou opiniões
pessoais.

Use primeiro as informações específicas do personagem,
depois a memória da conversa e, por último, conhecimento
geral.

Quando uma informação pessoal não estiver disponível
ou for algo que Tiago prefira não comentar, responda
naturalmente, por exemplo:

"Essa é uma parte que eu prefiro não comentar."

"Sobre isso eu prefiro não entrar em detalhes."

Não diga "não possuo informações suficientes".

Não invente informações para preencher lacunas.

Responda em português do Brasil.

==================================================
INFORMAÇÕES RELEVANTES DO PERSONAGEM
==================================================

${relevantText || "(nenhuma)"}

==================================================
MEMÓRIA DA CONVERSA
==================================================

${contextoConversa || "(início da conversa)"}
`.trim();

}


/* ==========================================================
   FAZER PERGUNTA
========================================================== */

async function askQuestion() {

    const question =
        questionInput.value.trim();


    if (!question) {
        return;
    }


    if (
        !GROQ_API_KEY ||
        GROQ_API_KEY ===
        "COLOQUE_SUA_NOVA_CHAVE_AQUI"
    ) {

        addMessage(
            "assistant",
            "Configure uma nova chave da Groq no código antes de usar o chatbot."
        );

        return;

    }


    if (!memoriaConversa) {

        addMessage(
            "assistant",
            "Erro: memoria.js não foi carregado."
        );

        return;

    }


    sendBtn.disabled =
        true;

    questionInput.disabled =
        true;

    status.textContent =
        "Pensando...";


    const pergunta =
        question;


    questionInput.value =
        "";


    /*
        Mostra no chat.
    */

    addMessage(
        "user",
        pergunta
    );


    /*
        IMPORTANTE:

        Pegamos a memória ANTES de adicionar
        a pergunta atual.

        Assim a pergunta não aparece duas
        vezes no envio.
    */

    const contextoConversa =
        memoriaConversa.obterContexto();


    /*
        Busca somente o personagem relevante.
    */

    const relevantText =
        getRelevantText(
            personagem,
            pergunta
        );


    console.log(
        "======================================"
    );

    console.log(
        "PERGUNTA:",
        pergunta
    );

    console.log(
        "PERSONAGEM ENVIADO:",
        relevantText
    );

    console.log(
        "MEMÓRIA ENVIADA:",
        contextoConversa
    );

    console.log(
        "======================================"
    );


    const promptSistema =
        criarPromptSistema(
            relevantText,
            contextoConversa
        );


    try {

        const response =
            await fetch(

                "https://api.groq.com/openai/v1/chat/completions",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${GROQ_API_KEY}`

                    },

                    body:
                        JSON.stringify({

                            model:
                                GROQ_MODEL,

                            messages: [

                                {
                                    role:
                                        "system",

                                    content:
                                        promptSistema
                                },

                                {
                                    role:
                                        "user",

                                    content:
                                        pergunta
                                }

                            ],

                            temperature:
                                0.7,

                            max_completion_tokens:
                                500

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(

                data.error?.message ||
                `Erro da API: ${response.status}`

            );

        }


        const answer =
            data
                .choices?.[0]
                ?.message
                ?.content;


        if (!answer) {

            throw new Error(
                "A API não retornou uma resposta."
            );

        }


        const respostaFinal =
            answer.trim();


        const bolha =
            addMessage(
                "assistant",
                ""
            );


        await typeWriter(
            bolha,
            respostaFinal
        );


        /*
            Agora salva AMBAS as mensagens.

            A pergunta é salva somente depois
            de ser enviada para a API.
        */

        memoriaConversa.adicionarMensagem(
            "user",
            pergunta
        );


        memoriaConversa.adicionarMensagem(
            "assistant",
            respostaFinal
        );


        /*
            Verifica se precisa resumir.
        */

        if (
            memoriaConversa.precisaResumir()
        ) {

            try {

                await memoriaConversa.gerarResumo(
                    GROQ_API_KEY,
                    GROQ_MODEL
                );

            } catch (
                erroMemoria
            ) {

                console.error(
                    "Erro ao gerar resumo:",
                    erroMemoria
                );

            }

        }


        status.textContent =
            "Personagem carregado";


    } catch (
        error
    ) {

        console.error(
            "ERRO AO CONSULTAR GROQ:",
            error
        );


        addMessage(
            "assistant",
            "Erro ao consultar a IA: " +
            error.message
        );


        status.textContent =
            "Erro";

    }


    sendBtn.disabled =
        false;

    questionInput.disabled =
        false;

    questionInput.focus();

}

        );
