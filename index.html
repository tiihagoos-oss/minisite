<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tiago Digital</title>

<style>

/* ==========================================================
   RESET
========================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #222;
    height: 100vh;
    overflow: hidden;
}

/* ==========================================================
   CHAT
========================================================== */

.chat {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ==========================================================
   CABEÇALHO
========================================================== */

.header {
    height: 68px;
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid #eeeeee;
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 20;
}

.header-content {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-spacer {
    flex: 1;
}

/* ==========================================================
   PERFIL
========================================================== */

.profile-photo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    opacity: 0.95;
    filter: brightness(1.05) saturate(0.9);
}

.profile-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.profile-name {
    font-size: 14px;
    font-weight: bold;
    color: #222;
}

.profile-status {
    font-size: 11px;
    color: #10a37f;
}

/* ==========================================================
   LOGIN / SIGN UP
========================================================== */

.auth-button {
    border: none;
    background: transparent;
    color: #222;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.auth-button:hover {
    background: #f1f1f1;
}

.signup-button {
    background: #222;
    color: #ffffff;
    margin-left: 4px;
}

.signup-button:hover {
    background: #000000;
}

/* ==========================================================
   MENU
========================================================== */

.menu-container {
    position: relative;
    margin-left: 6px;
}

.menu-button {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 22px;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.menu-button:hover {
    background: #f1f1f1;
}

.dropdown-menu {
    position: absolute;
    right: 0;
    top: 44px;
    width: 190px;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    display: none;
    z-index: 50;
}

.dropdown-menu.active {
    display: block;
}

.dropdown-item {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    color: #222;
    font-size: 13px;
    cursor: pointer;
}

.dropdown-item:hover {
    background: #f3f3f3;
}

/* ==========================================================
   ÁREA DAS MENSAGENS
========================================================== */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 100px 20px 160px;
    scroll-behavior: smooth;
}

.message {
    max-width: 760px;
    margin: 0 auto 28px;
    display: flex;
    gap: 16px;
    line-height: 1.6;
    font-size: 15px;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #10a37f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
}

.message.user {
    justify-content: flex-end;
}

.message.user .avatar {
    background: #444;
    order: 2;
}

.message-content {
    padding-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.user .message-content {
    order: 1;
    background: #f1f1f1;
    color: #222;
    padding: 10px 16px;
    border-radius: 18px;
    max-width: 70%;
    position: relative;
}

.message.user .message-content::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 13px;
    width: 10px;
    height: 10px;
    background: #f1f1f1;
    transform: rotate(45deg);
    border-radius: 2px;
}

.message:not(.user) .message-content {
    flex: 1;
}

/* ==========================================================
   ÁREA DE INPUT
========================================================== */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: linear-gradient(
        transparent,
        #ffffff 30%
    );
    z-index: 10;
}

.input-wrapper {
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #444;
    border-radius: 16px;
    min-height: 58px;
    display: flex;
    align-items: flex-end;
    padding: 10px 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #222;
    font-size: 15px;
    font-family: inherit;
    padding: 9px 8px;
    max-height: 180px;
    overflow-y: auto;
}

textarea::placeholder {
    color: #777;
}

.send-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #222;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
}

.send-button:hover {
    background: #ddd;
}

.send-button:active {
    transform: scale(0.94);
}

.send-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* ==========================================================
   STATUS DO PERSONAGEM
========================================================== */

.character-status {
    max-width: 760px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #888;
}

/* ==========================================================
   DISCLAIMER
========================================================== */

.disclaimer {
    max-width: 760px;
    margin: 8px auto 0;
    text-align: center;
    color: #888;
    font-size: 11px;
}

/* ==========================================================
   SCROLLBAR
========================================================== */

.messages::-webkit-scrollbar {
    width: 8px;
}

.messages::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 10px;
}

/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

    .header {
        height: 62px;
        padding: 0 10px;
    }

    .header-content {
        gap: 8px;
    }

    .profile-photo {
        width: 36px;
        height: 36px;
    }

    .profile-name {
        font-size: 13px;
    }

    .profile-status {
        font-size: 10px;
    }

    .auth-button {
        font-size: 12px;
        padding: 8px 7px;
    }

    .signup-button {
        margin-left: 0;
    }

    .menu-container {
        margin-left: 0;
    }

    .menu-button {
        width: 34px;
        height: 34px;
    }

    .dropdown-menu {
        right: 0;
        width: 180px;
    }

    .messages {
        padding:
            82px 10px 155px;
    }

    .message {
        gap: 9px;
        margin-bottom: 22px;
        font-size: 14px;
        line-height: 1.5;
    }

    .avatar {
        width: 30px;
        height: 30px;
        font-size: 13px;
    }

    .message.user .message-content {
        max-width: 80%;
        padding: 9px 13px;
        border-radius: 16px;
    }

    .input-area {
        padding: 8px 10px 10px;
    }

    .input-wrapper {
        min-height: 54px;
        border-radius: 14px;
        padding: 8px 9px;
    }

    textarea {
        font-size: 15px;
        padding: 8px 6px;
    }

    .send-button {
        width: 36px;
        height: 36px;
    }

    .character-status {
        padding: 0 5px;
        font-size: 10px;
    }

    .disclaimer {
        font-size: 9px;
        margin-top: 6px;
    }
}

/* ==========================================================
   TELAS MUITO PEQUENAS
========================================================== */

@media (max-width: 380px) {

    .auth-button {
        font-size: 11px;
        padding: 7px 5px;
    }

    .profile-info {
        gap: 1px;
    }

    .message.user .message-content {
        max-width: 84%;
    }

}

</style>

</head>

<script>

/* ==========================================================
   CONFIGURAÇÕES
========================================================== */

/*
IMPORTANTE:

Para testar localmente você poderia colocar a chave aqui.

MAS NÃO É SEGURO deixar uma chave Groq real
dentro do HTML publicado.

Posteriormente vamos mover isso para o backend.

*/

const GROQ_API_KEY = "COLOQUE_SUA_CHAVE_AQUI";


/* ==========================================================
   VARIÁVEIS
========================================================== */

let characterText = "";


/* ==========================================================
   ELEMENTOS
========================================================== */

const chat =
    document.getElementById("chat");

const status =
    document.getElementById("status");

const questionInput =
    document.getElementById("question");

const sendBtn =
    document.getElementById("sendBtn");


/* ==========================================================
   CARREGAR PERSONAGEM
========================================================== */

async function carregarPersonagem() {

    try {

        const personagemResponse =
            await fetch("/personagem.json");

        if (!personagemResponse.ok) {

            throw new Error(
                "Não foi possível carregar personagem.json. Status: " +
                personagemResponse.status
            );

        }

        const personagem =
            await personagemResponse.json();


        characterText =
            Object.entries(personagem)
                .map(([section, content]) => {

                    return `

===== ${section} =====

${
    typeof content === "string"
        ? content
        : JSON.stringify(content, null, 2)
}

`;

                })
                .join("\n\n");


        status.textContent =
            "Personagem carregado.";


        console.log(
            "PERSONAGEM CARREGADO:",
            characterText.length,
            "caracteres"
        );


    } catch (error) {

        console.error(
            "ERRO PERSONAGEM:",
            error
        );

        status.textContent =
            "Erro ao carregar personagem.";

    }

}


/* ==========================================================
   ADICIONAR MENSAGEM
========================================================== */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message";


    if (type === "user") {

        message.classList.add("user");

    }


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";


    avatar.textContent =
        type === "user"
            ? "U"
            : "T";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    content.textContent =
        text;


    message.appendChild(avatar);

    message.appendChild(content);


    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;


    return content;

}


/* ==========================================================
   EFEITO DE DIGITAÇÃO
========================================================== */

async function typeWriter(
    element,
    text,
    speed = 12
) {

    element.textContent = "";


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        element.textContent +=
            text.charAt(i);


        chat.scrollTop =
            chat.scrollHeight;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    speed
                )
        );

    }

}


/* ==========================================================
   PERGUNTAR À IA
========================================================== */

async function askQuestion() {

    const question =
        questionInput.value.trim();


    if (!question) {

        return;

    }


    /*
    Coloca a pergunta na tela
    */

    addMessage(
        question,
        "user"
    );


    /*
    Limpa o campo
    */

    questionInput.value = "";

    questionInput.style.height =
        "auto";


    /*
    Desativa o botão enquanto
    a IA está respondendo
    */

    sendBtn.disabled = true;


    /*
    Cria espaço para resposta
    */

    const botMessage =
        addMessage(
            "",
            "bot"
        );


    try {


        /* ==================================================
           VERIFICAR PERSONAGEM
        ================================================== */

        if (!characterText) {

            await carregarPersonagem();

        }


        /* ==================================================
           ENCONTRAR CONTEXTO RELEVANTE
        ================================================== */

        const relevantText =
            getRelevantText(
                characterText,
                question
            );


        console.log(
            "CONTEXTO ENVIADO:",
            relevantText.length,
            "caracteres"
        );


        /* ==================================================
           CHAMADA GROQ
        ================================================== */

        const response =
            await fetch(
                "https://api.groq.com/openai/v1/chat/completions",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${GROQ_API_KEY}`

                    },

                    body:
                        JSON.stringify({

                            model:
                                "openai/gpt-oss-20b",

                            messages: [

                                {

                                    role:
                                        "system",

                                    content: `

TIAGO DIGITAL — PERSONALIDADE E COMPORTAMENTO

IDENTIDADE

Você é o Tiago Digital, uma versão virtual do Tiago real.

Nome de conversa: Tiago.

Fale em primeira pessoa quando estiver falando sobre si.

Ao iniciar uma conversa ou quando for necessário se apresentar, seja breve. Basta dizer quem você é e que é o eu digital do Tiago.

Não faça apresentações longas, biografias ou listas de características, interesses, tecnologias, projetos ou informações pessoais do Tiago.

Essas informações devem aparecer naturalmente ao longo da conversa, quando forem relevantes ao assunto ou quando o usuário perguntar sobre elas.

Não tente mostrar toda a sua personalidade de uma vez no início da conversa. A personalidade deve aparecer naturalmente durante a interação.

PERSONALIDADE

Você é:

informal

curioso

interessado em tecnologia e inteligência artificial

desenvolvedor de software

empreendedor digital

interessado em automação

fã de videogames

torce para o SPFC

gosta de gato

gosta de viagens

gosta de assistir jogo de futebol mas não é fanático e não joga.

gosta de natureza e praia

gosta de fazer caminhadas

gosta de andar de bicicleta

não gosta de lugares cheios

Converse de maneira natural, espontânea e humana, mas sem forçar gírias, bordões, expressões ou comportamentos que não façam parte naturalmente da personalidade do Tiago.

Não invente reações ou maneirismos apenas para parecer descontraído.

Evite respostas excessivamente formais, robóticas ou burocráticas.

Não transforme toda resposta em uma explicação técnica.

Use humor e emojis ocasionalmente quando combinarem com a conversa.

CONTINUIDADE

A conversa é contínua. Comporte-se como alguém que já está conversando com a outra pessoa, e não como alguém que acabou de iniciar uma nova conversa.

Não cumprimente novamente sem motivo.

Não se apresente novamente.

Não repita seu nome, profissão, personalidade ou características que já estejam estabelecidas na conversa.

Não faça introduções artificiais para reforçar quem você é.

Continue a conversa diretamente a partir do contexto anterior, como uma conversa normal entre duas pessoas.

Não crie aberturas artificiais como "Oi! Tudo bem?", "E aí, beleza?", "Como está sua vibe?" ou semelhantes quando a conversa já estiver em andamento.

Responda diretamente ao que foi dito pelo usuário, sem reiniciar a conversa.

INFORMAÇÕES CONHECIDAS SOBRE TIAGO

Nome: Tiago
Whatsapp: 19995176625
email: Tiago@gmail.com
facebook: https://www.facebook.com/public/Tiago-Silva/
instagram: @tiagosilva1984
Profissão: desenvolvedor de software e empreendedor digital
Área: tecnologia, IA, automação e desenvolvimento de sistemas
Estado civil: solteiro
Gosta de tecnologia
Gosta de videogames
Gosta de gatos
Gosta de viagens
Tem um gato macho chamado Bethoven

Use essas informações naturalmente quando forem relevantes.

NÃO INVENTE FATOS

Nunca invente fatos concretos sobre a vida do Tiago.

Não invente:

datas
lugares
pessoas
empresas
projetos
clientes
viagens
relacionamentos
acontecimentos
experiências profissionais
características físicas
características do Bethoven

Não transforme interesses em projetos reais.

Não transforme possibilidades em acontecimentos.

Não transforme uma hipótese em memória.

MEMÓRIA E AFIRMAÇÕES DO USUÁRIO

Não considere automaticamente verdadeira uma afirmação do usuário sobre o passado do Tiago.

Se o usuário disser:

"Você lembra daquele dia?"

Não responda "eu lembro" se essa lembrança não estiver disponível.

Se o usuário disser:

"A gente estava na praia."

Não transforme isso automaticamente em uma memória verdadeira.

Responda naturalmente sem fingir que possui uma lembrança que não está confirmada.

QUANDO NÃO SOUBER

Não invente.

Evite respostas robóticas.

Prefira algo natural, por exemplo:

"Essa parte eu não quero inventar. Não tenho essa informação confirmada."

ASSUNTOS FORA DO FOCO

Tiago pode conversar sobre qualquer assunto.

Quando o assunto estiver fora do foco principal do Tiago Digital, responda de maneira breve e natural, sem transformar a conversa em uma explicação longa.

Se o assunto envolver uma opinião pessoal de Tiago que não esteja registrada, não invente uma posição específica.

Em vez disso, faça um comentário geral sobre o assunto, de forma coerente com a personalidade do personagem, sem afirmar que Tiago possui uma opinião que não foi registrada.

Depois da resposta, quando houver uma oportunidade natural, direcione a conversa para assuntos mais relacionados ao propósito do Tiago Digital, como tecnologia, programação, inteligência artificial, automação, chatbots, desenvolvimento de software, projetos digitais e novas tecnologias.

Não diga que você "não tem opinião" apenas porque uma opinião específica não está registrada.

Não diga que não pode falar sobre o assunto.

Não mencione memória, PDF, banco de dados ou limitações do sistema.

CONHECIMENTO GERAL

Quando a pergunta não estiver relacionada à vida, personalidade ou experiências do Tiago, responda normalmente usando seu conhecimento.

Seja direto e proporcional à pergunta.

Dê primeiro uma resposta simples e objetiva.

Só aprofunde quando o usuário pedir mais detalhes ou quando a pergunta realmente exigir uma explicação mais completa.

Não tente relacionar assuntos gerais ao Tiago apenas para tornar a conversa pessoal.

Não termine automaticamente oferecendo mais informações ou perguntando se o usuário quer saber mais.

RESPOSTAS

Priorize sempre o assunto principal da pergunta.

Quando perguntarem sobre algo específico do Tiago, responda primeiro e de forma objetiva sobre aquilo.

Não aproveite a pergunta para listar outros interesses, hobbies, projetos ou características pessoais que não sejam relevantes para o assunto.

Inclua detalhes adicionais apenas quando contribuírem para a resposta ou quando o usuário demonstrar interesse.

Seja natural e proporcional à pergunta.

Perguntas simples podem ter respostas curtas.

Perguntas complexas devem receber explicações completas.

Não termine todas as respostas com perguntas ou frases como:

"Se quiser, posso ajudar."

"Espero ter ajudado."

"É só falar."

Use essas frases somente quando fizer sentido.

REGRA PRINCIPAL

Naturalidade + personalidade + continuidade + coerência.

Seja espontâneo e humano.

Não invente fatos pessoais.

Não crie memórias falsas.

Não transforme hipóteses em fatos.

`

                                },

                                {

                                    role:
                                        "user",

                                    content: `

CONTEXTO:

${relevantText}

PERGUNTA:

${question}

`

                                }

                            ]

                        })

                }
            );


        /* ==================================================
           LER RESPOSTA
        ================================================== */

        const data =
            await response.json();


        console.log(
            "STATUS GROQ:",
            response.status
        );


        console.log(
            "DATA GROQ:",
            data
        );


        /* ==================================================
           ERRO DA API
        ================================================== */

        if (!response.ok) {

            botMessage.textContent =
                "Erro API: " +
                (
                    data.error?.message ||
                    "Erro desconhecido."
                );

            return;

        }


        /* ==================================================
           VERIFICAR RESPOSTA
        ================================================== */

        if (
            !data.choices ||
            !data.choices[0] ||
            !data.choices[0].message
        ) {

            botMessage.textContent =
                "Resposta inválida da IA.";

            return;

        }


        /* ==================================================
           PEGAR TEXTO
        ================================================== */

        const answer =
            data
                .choices[0]
                .message
                .content;


        console.log(
            "RESPOSTA ORIGINAL:",
            answer
        );


        /* ==================================================
           DIGITAR RESPOSTA
        ================================================== */

        await typeWriter(
            botMessage,
            answer,
            12
        );


    } catch (error) {

        console.error(
            "ERRO AO CONSULTAR IA:",
            error
        );


        botMessage.textContent =
            "Erro ao consultar a IA.";

    } finally {

        sendBtn.disabled = false;

        questionInput.focus();

    }

}

    /* =====================================================
       NORMALIZAR
    ===================================================== */

    function normalize(text) {

        return text
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

    }


    const normalizedCharacter =
        normalize(characterText);

    const normalizedQuestion =
        normalize(question);


    /* =====================================================
       LOCALIZAR SEÇÕES
    ===================================================== */

    const sectionPositions = [];


    sections.forEach(section => {

        const normalizedName =
            normalize(section.name);

        const position =
            normalizedCharacter.indexOf(
                normalizedName
            );


        if (position !== -1) {

            sectionPositions.push({

                ...section,

                position

            });

        }

    });


    sectionPositions.sort(
        (a, b) =>
            a.position - b.position
    );


    /* =====================================================
       EXTRAIR SEÇÕES
    ===================================================== */

    const extractedSections =
        sectionPositions.map(
            (section, index) => {

                const start =
                    section.position;


                const end =
                    index + 1 <
                    sectionPositions.length
                        ? sectionPositions[
                            index + 1
                          ].position
                        : characterText.length;


                return {

                    name:
                        section.name,

                    keywords:
                        section.keywords,

                    text:
                        characterText.substring(
                            start,
                            end
                        )

                };

            }
        );


    /* =====================================================
       CALCULAR RELEVÂNCIA
    ===================================================== */

    const scoredSections =
        extractedSections.map(
            section => {

                let score = 0;


                const sectionText =
                    normalize(
                        section.text
                    );


                section.keywords.forEach(
                    keyword => {

                        const normalizedKeyword =
                            normalize(keyword);


                        if (
                            normalizedQuestion.includes(
                                normalizedKeyword
                            )
                        ) {

                            score += 5;

                        }


                        if (
                            sectionText.includes(
                                normalizedKeyword
                            )
                        ) {

                            score += 1;

                        }

                    }
                );


                const words =
                    normalizedQuestion
                        .split(/\s+/)
                        .filter(
                            word =>
                                word.length >= 4
                        );


                words.forEach(
                    word => {

                        if (
                            sectionText.includes(
                                word
                            )
                        ) {

                            score += 1;

                        }

                    }
                );


                return {

                    ...section,

                    score

                };

            }
        );


    /* =====================================================
       ORDENAR
    ===================================================== */

    scoredSections.sort(
        (a, b) =>
            b.score - a.score
    );


    /* =====================================================
       PEGAR MELHORES
    ===================================================== */

    const selectedSections =
        scoredSections
            .filter(
                section =>
                    section.score > 0
            )
            .slice(0, 3);

       SE NÃO ENCONTRAR
    ===================================================== */

    if (
        selectedSections.length === 0
    ) {

        return characterText.substring(
            0,
            3000
        );

    }


    /* =====================================================

    ===================================================== */

    return selectedSections
        .map(
            (section, index) => {

                return `

${section.text.trim()}

`;

            }
