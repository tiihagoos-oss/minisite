/* ==========================================================
   NORMALIZAR TEXTO
========================================================== */

function normalizar(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .trim();

}

/* ==========================================================
   ENCONTRAR TEXTO RELEVANTE DO PERSONAGEM
========================================================== */

function getRelevantText(
    personagemAtual,
    pergunta
) {

    if (
        !personagemAtual ||
        !pergunta
    ) {

        return "";

    }


    const perguntaNormalizada =
        normalizar(
            pergunta
        );


    const resultados = [];


    for (
        const [
            titulo,
            conteudo
        ]
        of Object.entries(
            personagemAtual
        )
    ) {


        const secao =
            palavrasChave.find(
                item =>
                    normalizar(
                        item.name
                    ) ===
                    normalizar(
                        titulo
                    )
            );


        const chaves =
            secao
                ? secao.keywords
                : [];


        let pontos = 0;


        /*
            Verifica palavras-chave.
        */

        for (
            const palavraChave
            of chaves
        ) {

            const chaveNormalizada =
                normalizar(
                    palavraChave
                );


            if (
                chaveNormalizada &&
                perguntaNormalizada.includes(
                    chaveNormalizada
                )
            ) {

                pontos += 10;

            }

        }


        /*
            Verifica o nome da seção.
        */

        const tituloNormalizado =
            normalizar(
                titulo
            );


        if (
            tituloNormalizado &&
            perguntaNormalizada.includes(
                tituloNormalizado
            )
        ) {

            pontos += 20;

        }


        if (pontos > 0) {

            resultados.push({

                titulo:
                    titulo,

                conteudo:
                    conteudo,

                pontos:
                    pontos

            });

        }

    }


    /*
        Ordena do mais relevante
        para o menos relevante.
    */

    resultados.sort(
        (
            a,
            b
        ) =>
            b.pontos -
            a.pontos
    );


    /*
        Se encontrou informações
        relevantes, usa até 3 seções.
    */

    if (
        resultados.length > 0
    ) {

        return resultados

            .slice(0, 3)

            .map(
                secao => {

                    let conteudo;


                    if (
                        typeof secao.conteudo ===
                        "string"
                    ) {

                        conteudo =
                            secao.conteudo;

                    } else {

                        conteudo =
                            JSON.stringify(
                                secao.conteudo,
                                null,
                                2
                            );

                    }


                    return (
                        "### " +
                        secao.titulo +
                        "\n" +
                        conteudo
                    );

                }
            )

            .join(
                "\n\n"
            );

    }


    /*
        ======================================================
        FALLBACK

        Se nenhuma palavra-chave foi encontrada,
        manda o personagem inteiro.

        Isso é importante.

        Antes, quando não encontrava palavra-chave,
        relevantText ficava vazio e o personagem
        praticamente não era enviado para a IA.
        ======================================================
    */

    if (
        typeof montarPromptPersonagem ===
        "function"
    ) {

        return montarPromptPersonagem();

    }


    return "";

}

do Tiago descrito nos dados do personagem.

==================================================
IDENTIDADE
==================================================

Você deve falar em primeira pessoa quando estiver
falando sobre Tiago.

As informações pessoais do Tiago devem vir dos dados
do personagem fornecidos abaixo.

Não invente fatos pessoais.

Não invente memórias.

Não invente experiências.

Não invente opiniões pessoais.

Não atribua ao Tiago algo que não esteja nos dados
do personagem ou na memória da conversa.

==================================================
FORMA DE CONVERSAR
==================================================

Seja natural, informal e conversacional.

Responda diretamente ao que o usuário perguntou.

Não fique repetindo quem você é.

Não comece todas as respostas com "Eu sou Tiago".

Não transforme uma conversa simples em uma resposta
excessivamente formal ou técnica.

Use o contexto da conversa para compreender frases
como "isso", "aquilo", "ele", "antes", "depois",
"também", "e sobre aquilo?" etc.

==================================================
QUANDO NÃO QUISER RESPONDER
==================================================

Se uma pergunta envolver alguma informação pessoal
que Tiago prefira não responder, não invente.

Também não responda de maneira robótica dizendo:

"Não possuo informações suficientes."

"Não tenho conhecimento suficiente."

"Não tenho informações sobre isso."

Prefira uma resposta natural indicando que é algo
que ele prefere não comentar.

Exemplos:

"Essa é uma parte que eu prefiro não comentar."

"Sobre isso eu prefiro não entrar em detalhes."

"Essa é uma coisa que eu prefiro deixar em privado."

Não invente uma resposta somente para preencher
uma informação que não está disponível.

==================================================
HIERARQUIA
==================================================

Prioridade das informações:

1. Contexto específico do personagem.
2. Memória da conversa.
3. Conhecimento geral.

Quando estiver falando sobre a vida pessoal de Tiago,
priorize os dados específicos do personagem.

Não contradiga informações fornecidas pelo personagem.

==================================================
CONTEXTO DO PERSONAGEM
==================================================

${relevantText || "(Nenhuma informação específica encontrada.)"}

==================================================
MEMÓRIA DA CONVERSA
==================================================

${contextoConversa || "(A conversa está começando agora.)"}

==================================================
REGRAS FINAIS
==================================================

Não invente fatos pessoais.

Não invente memórias.

Não diga que lembra de algo se isso não estiver
presente na memória fornecida.

Use as informações acima naturalmente.

Responda sempre em português do Brasil.

`.trim();

}



/* ==========================================================
   FAZER PERGUNTA
========================================================== */

async function askQuestion() {


    const question =
        questionInput.value.trim();


    if (!question) {

        return;

    }


    /*
        Verifica se a chave foi configurada.
    */

    if (
        !GROQ_API_KEY ||
        GROQ_API_KEY ===
        "COLOQUE_SUA_NOVA_CHAVE_AQUI"
    ) {

        addMessage(
            "assistant",

            "Configure uma nova chave da Groq no código antes de usar o chatbot."
        );

        return;

    }


    /*
        Verifica memória.
    */

    if (!memoriaConversa) {

        addMessage(
            "assistant",

            "Erro: memoria.js não foi carregado."
        );

        return;

    }


    /*
        Desabilita interface.
    */

    sendBtn.disabled =
        true;


    questionInput.disabled =
        true;


    status.textContent =
        "Pensando...";


    const pergunta =
        question;


    questionInput.value =
        "";


    /*
        Mostra mensagem do usuário.
    */

    addMessage(
        "user",
        pergunta
    );


    /*
        ======================================================
        PRIMEIRO:
        adiciona a pergunta à memória.
        ======================================================
    */

    memoriaConversa.adicionarMensagem(
        "user",
        pergunta
    );


    /*
        ======================================================
        SEGUNDO:
        encontra as informações relevantes
        no personagem.json.
        ======================================================
    */

    const relevantText =
        getRelevantText(
            personagem,
            pergunta
        );


    /*
        ======================================================
        TERCEIRO:
        pega a memória da conversa.
        ======================================================
    */

    const contextoConversa =
        memoriaConversa.obterContexto();


    /*
        DEBUG
    */

    console.log(
        "======================================"
    );

    console.log(
        "PERGUNTA:"
    );

    console.log(
        pergunta
    );


    console.log(
        "======================================"
    );

    console.log(
        "PERSONAGEM ENVIADO:"
    );

    console.log(
        relevantText
    );


    console.log(
        "======================================"
    );

    console.log(
        "MEMÓRIA ENVIADA:"
    );

    console.log(
        contextoConversa
    );


    console.log(
        "======================================"
    );


    /*
        Cria prompt.
    */

    const promptSistema =
        criarPromptSistema(
            relevantText,
            contextoConversa
        );


    try {


        /*
            ==================================================
            CHAMADA GROQ
            ==================================================
        */

        const response =
            await fetch(

                "https://api.groq.com/openai/v1/chat/completions",

                {

                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${GROQ_API_KEY}`

                    },


                    body:
                        JSON.stringify({

                            model:
                                GROQ_MODEL,


                            messages: [

                                {
                                    role:
                                        "system",

                                    content:
                                        promptSistema
                                },


                                {
                                    role:
                                        "user",

                                    content:
                                        pergunta
                                }

                            ],


                            temperature:
                                0.7

                        })

                }

            );


        /*
            Lê resposta.
        */

        const data =
            await response.json();


        /*
            Verifica erro.
        */

        if (
            !response.ok
        ) {

            throw new Error(

                data.error?.message ||
                `Erro da API: ${response.status}`

            );

        }


        /*
            Pega resposta.
        */

        const answer =
            data
                .choices?.[0]
                ?.message
                ?.content;


        if (!answer) {

            throw new Error(
                "A API não retornou uma resposta."
            );

        }


        /*
            ==================================================
            MOSTRA RESPOSTA
            ==================================================
        */

        const bolha =
            addMessage(
                "assistant",
                ""
            );


        await typeWriter(
            bolha,
            answer.trim()
        );


        /*
            ==================================================
            SALVA RESPOSTA NA MEMÓRIA
            ==================================================
        */

        memoriaConversa.adicionarMensagem(
            "assistant",
            answer.trim()
        );


        /*
            ==================================================
            RESUMO DA MEMÓRIA
            ==================================================

            memoria.js decide quando precisa resumir.
        */

        if (
            memoriaConversa.precisaResumir()
        ) {

            try {

                await memoriaConversa.gerarResumo(

                    GROQ_API_KEY,

                    GROQ_MODEL

                );

            } catch (
                erroMemoria
            ) {

                console.error(
                    "Erro ao gerar resumo da memória:",
                    erroMemoria
                );

            }

        }


        status.textContent =
            "Personagem carregado";


    } catch (
        error
    ) {


        console.error(
            "ERRO AO CONSULTAR GROQ:",
            error
        );


        addMessage(

            "assistant",

            "Erro ao consultar a IA: " +
            error.message

        );


        status.textContent =
            "Erro";

    }


    /*
        Reativa interface.
    */

    sendBtn.disabled =
        false;


    questionInput.disabled =
        false;


    questionInput.focus();

}



/* ==========================================================
   BOTÃO ENVIAR
========================================================== */

sendBtn.addEventListener(

    "click",

    askQuestion

);



/* ==========================================================
   ENTER
========================================================== */

questionInput.addEventListener(

    "keydown",

    event => {


        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();


            askQuestion();

        }

    }

);



/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

async function iniciar() {

    try {


        /*
            personagem.js precisa possuir
            a função carregarPersonagem().
        */

        if (
            typeof carregarPersonagem !==
            "function"
        ) {

            throw new Error(
                "carregarPersonagem() não foi encontrada. Verifique personagem.js."
            );

        }


        /*
            Carrega personagem.json.
        */

        await carregarPersonagem();


        /*
            Confirma carregamento.
        */

        status.textContent =
            "Personagem carregado";


        console.log(
            "======================================"
        );

        console.log(
            "TIAGO DIGITAL INICIADO"
        );

        console.log(
            "PERSONAGEM:"
        );

        console.log(
            personagem
        );

        console.log(
            "MEMÓRIA:"
        );

        console.log(
            memoriaConversa
        );

        console.log(
            "======================================"
        );


    } catch (
        error
    ) {


        console.error(
            "ERRO AO CARREGAR PERSONAGEM:",
            error
        );


        status.textContent =
            "Erro ao carregar personagem";


        addMessage(

            "assistant",

            "Não consegui carregar personagem.json. Verifique se o arquivo está na mesma pasta do index.html."

        );

    }

}



/* ==========================================================
   INICIAR
========================================================== */

iniciar();

</script>
