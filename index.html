<style>

/* ==========================================================
   RESET
========================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ==========================================================
   BODY
========================================================== */

body {

    font-family: Arial, Helvetica, sans-serif;

    background: #f7f8fa;

    color: #222;

    height: 100vh;

    overflow: hidden;

}


/* ==========================================================
   HEADER
========================================================== */

header {

    height: 68px;

    background: #ffffff;

    border-bottom: 1px solid #e5e7eb;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    position: relative;

    z-index: 10;

}


/* ==========================================================
   PERFIL
========================================================== */

.perfil {

    display: flex;

    align-items: center;

    gap: 10px;

}


.perfil img {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    object-fit: cover;

}


.info-perfil {

    display: flex;

    flex-direction: column;

    justify-content: center;

}


.nome {

    font-size: 16px;

    font-weight: 600;

    color: #222;

}


.online {

    font-size: 12px;

    color: #22a06b;

    margin-top: 2px;

}


/* ==========================================================
   PARTE DIREITA DO HEADER
========================================================== */

.header-direita {

    display: flex;

    align-items: center;

    gap: 10px;

}


/* ==========================================================
   LOGIN
========================================================== */

.login {

    background: transparent;

    border: none;

    color: #444;

    font-size: 14px;

    cursor: pointer;

    padding: 8px 10px;

}


.login:hover {

    color: #111;

}


/* ==========================================================
   SIGN UP
========================================================== */

.signup {

    background: #111827;

    border: none;

    color: white;

    font-size: 14px;

    cursor: pointer;

    padding: 8px 14px;

    border-radius: 8px;

}


.signup:hover {

    background: #1f2937;

}


/* ==========================================================
   MENU
========================================================== */

.menu-container {

    position: relative;

}


.menu-btn {

    border: none;

    background: transparent;

    font-size: 23px;

    cursor: pointer;

    color: #444;

    width: 38px;

    height: 38px;

    border-radius: 8px;

}


.menu-btn:hover {

    background: #f1f2f4;

}


/* ==========================================================
   MENU DROPDOWN
========================================================== */

.menu-dropdown {

    display: none;

    position: absolute;

    right: 0;

    top: 46px;

    width: 190px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    box-shadow: 0 8px 25px rgba(0,0,0,.10);

    overflow: hidden;

}


.menu-dropdown.ativo {

    display: block;

}


.menu-dropdown button {

    display: block;

    width: 100%;

    border: none;

    background: white;

    text-align: left;

    padding: 12px 15px;

    cursor: pointer;

    color: #333;

    font-size: 14px;

}


.menu-dropdown button:hover {

    background: #f5f5f5;

}


/* ==========================================================
   CONTAINER PRINCIPAL
========================================================== */

.container {

    height: calc(100vh - 68px);

    max-width: 1000px;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

}


/* ==========================================================
   CHAT
========================================================== */

#chat {

    flex: 1;

    overflow-y: auto;

    padding: 28px 20px 20px;

}


/* ==========================================================
   MENSAGENS
========================================================== */

.mensagem {

    display: flex;

    margin-bottom: 18px;

}


.mensagem.usuario {

    justify-content: flex-end;

}


.mensagem.assistente {

    justify-content: flex-start;

}


.bolha {

    max-width: 75%;

    padding: 13px 16px;

    line-height: 1.55;

    font-size: 15px;

    white-space: pre-wrap;

    word-break: break-word;

    border-radius: 15px;

}


.usuario .bolha {

    background: #2563eb;

    color: white;

    border-bottom-right-radius: 4px;

}


.assistente .bolha {

    background: white;

    color: #222;

    border: 1px solid #e4e5e7;

    border-bottom-left-radius: 4px;

}


/* ==========================================================
   STATUS
========================================================== */

#status {

    text-align: center;

    font-size: 12px;

    color: #777;

    padding: 4px 10px;

}


/* ==========================================================
   AVISO
========================================================== */

.aviso {

    text-align: center;

    color: #999;

    font-size: 11px;

    padding: 7px 15px;

}


/* ==========================================================
   ÁREA DE INPUT
========================================================== */

.input-area {

    padding: 12px 15px 15px;

}


.input-box {

    display: flex;

    align-items: flex-end;

    gap: 10px;

    background: white;

    border: 1px solid #d9dce1;

    border-radius: 14px;

    padding: 8px;

#question {

    padding: 9px 8px;

    font-family: Arial, Helvetica, sans-serif;

    header {

    }

    }


    .input-area {

        padding: 8px;

    }

/* ==========================================================
   ADICIONAR MENSAGEM
========================================================== */

function addMessage(
    role,
    content
) {

    const mensagem =
        document.createElement(
            "div"
        );


    mensagem.className =
        "mensagem " +
        (
            role === "user"
                ? "usuario"
                : "assistente"
        );


    const bolha =
        document.createElement(
            "div"
        );


    bolha.className =
        "bolha";


    bolha.textContent =
        content;


    mensagem.appendChild(
        bolha
    );


    chat.appendChild(
        mensagem
    );


    chat.scrollTop =
        chat.scrollHeight;


    return bolha;

}



/* ==========================================================
   EFEITO DE DIGITAÇÃO
========================================================== */

async function typeWriter(
    element,
    text
) {

    element.textContent = "";


    for (
        const caractere of text
    ) {

        element.textContent +=
            caractere;


        chat.scrollTop =
            chat.scrollHeight;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    8
                )
        );

    }

}



/* ==========================================================
   NORMALIZAÇÃO
========================================================== */

function normalizar(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .trim();

}

/* ==========================================================
   BUSCAR CONTEXTO DO PERSONAGEM
========================================================== */

function getRelevantText(
    personagemAtual,
    pergunta
) {

    if (
        !personagemAtual ||
        !pergunta
    ) {

        return "";

    }


    const perguntaNormalizada =
        normalizar(
            pergunta
        );


    const resultados = [];


    for (
        const [
            titulo,
            conteudo
        ]
        of Object.entries(
            personagemAtual
        )
    ) {


        const secao =
            palavrasChave.find(
                item =>
                    normalizar(
                        item.name
                    ) ===
                    normalizar(
                        titulo
                    )
            );


        const chaves =
            secao
                ? secao.keywords
                : [];


        let pontos = 0;


        for (
            const palavraChave
            of chaves
        ) {

            const chave =
                normalizar(
                    palavraChave
                );


            if (
                chave &&
                perguntaNormalizada.includes(
                    chave
                )
            ) {

                pontos += 10;

            }

        }


        const tituloNormalizado =
            normalizar(
                titulo
            );


        if (
            tituloNormalizado &&
            perguntaNormalizada.includes(
                tituloNormalizado
            )
        ) {

            pontos += 20;

        }


        if (pontos > 0) {

            resultados.push({

                titulo:
                    titulo,

                conteudo:
                    conteudo,

                pontos:
                    pontos

            });

        }

    }


    resultados.sort(
        (a, b) =>
            b.pontos -
            a.pontos
    );


    /*
        Se encontrou informações específicas,
        utiliza até 3 seções.
    */

    if (
        resultados.length > 0
    ) {

        return resultados

            .slice(0, 3)

            .map(
                secao => {

                    const conteudo =
                        typeof secao.conteudo ===
                        "string"

                            ? secao.conteudo

                            : JSON.stringify(
                                secao.conteudo,
                                null,
                                2
                            );


                    return (
                        "### " +
                        secao.titulo +
                        "\n\n" +
                        conteudo
                    );

                }
            )

            .join(
                "\n\n"
            );

    }


    /*
        ======================================================
        FALLBACK
        ======================================================

        Se nenhuma palavra-chave foi encontrada,
        utiliza o personagem inteiro.
    */

    if (
        typeof montarPromptPersonagem ===
        "function"
    ) {

        return montarPromptPersonagem();

    }


    return "";

}



/* ==========================================================
   PROMPT DO SISTEMA
========================================================== */

function criarPromptSistema(
    relevantText,
    contextoConversa
) {

    return `

Você é o Tiago Digital, uma representação virtual
do Tiago descrito nos dados do personagem.

Fale em primeira pessoa quando estiver falando sobre
Tiago.

Não invente fatos pessoais.

Não invente memórias.

Não invente experiências.

dados fornecidos.

Use as informações do personagem para responder
perguntas pessoais sobre Tiago.

Também não use respostas robóticas como:

"Não possuo informações suficientes."

"Não tenho conhecimento suficiente."

"Não tenho informações sobre isso."

Prefira respostas naturais como:

"Essa é uma parte que eu prefiro não comentar."

"Sobre isso eu prefiro não entrar em detalhes."

Responda diretamente ao que foi perguntado.

Use a memória da conversa para compreender

==================================================
CONTEXTO DO PERSONAGEM
==================================================

${relevantText || "(Nenhum contexto específico encontrado.)"}

==================================================
MEMÓRIA DA CONVERSA
==================================================

${contextoConversa || "(A conversa está começando agora.)"}

==================================================
REGRAS
==================================================

Não invente fatos pessoais.

Não invente memórias.

Não diga que lembra de algo se isso não estiver
presente no contexto.

Responda em português do Brasil.

`.trim();

}



/* ==========================================================
   ASK QUESTION
========================================================== */

async function askQuestion() {


    const question =
        questionInput.value.trim();


    if (!question) {

        return;

    }


    if (
        !GROQ_API_KEY ||
        GROQ_API_KEY ===
        "COLOQUE_SUA_NOVA_CHAVE_AQUI"
    ) {

        addMessage(
            "assistant",
            "Configure uma nova chave da Groq antes de usar o chatbot."
        );

        return;

    }


    if (!memoriaConversa) {

        addMessage(
            "assistant",
            "Erro: memoria.js não foi carregado."
        );

        return;

    }


    sendBtn.disabled =
        true;


    questionInput.disabled =
        true;


    status.textContent =
        "Pensando...";


    const pergunta =
        question;


    questionInput.value =
        "";


    /*
        Mostra a pergunta.
    */

    addMessage(
        "user",
        pergunta
    );


    /*
        ======================================================
        MEMÓRIA — PERGUNTA
        ======================================================
    */

    memoriaConversa.adicionarMensagem(
        "user",
        pergunta
    );


    /*
        ======================================================
        PERSONAGEM
        ======================================================
    */

    const relevantText =
        getRelevantText(
            personagem,
            pergunta
        );


    /*
        ======================================================
        MEMÓRIA
        ======================================================
    */

    const contextoConversa =
        memoriaConversa.obterContexto();


    /*
        DEBUG
    */

    console.log(
        "CONTEXTO DO PERSONAGEM:",
        relevantText
    );


    console.log(
        "MEMÓRIA:",
        contextoConversa
    );


    /*
        ======================================================
        PROMPT
        ======================================================
    */

    const promptSistema =
        criarPromptSistema(
            relevantText,
            contextoConversa
        );


    try {


        const response =
            await fetch(

                "https://api.groq.com/openai/v1/chat/completions",

                {

                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${GROQ_API_KEY}`

                    },


                    body:
                        JSON.stringify({

                            model:
                                GROQ_MODEL,


                            messages: [

                                {
                                    role:
                                        "system",

                                    content:
                                        promptSistema
                                },


                                {
                                    role:
                                        "user",

                                    content:
                                        pergunta
                                }

                            ],


                            temperature:
                                0.7

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(

                data.error?.message ||
                `Erro da API: ${response.status}`

            );

        }


        const answer =
            data
                .choices?.[0]
                ?.message
                ?.content;


        if (!answer) {

            throw new Error(
                "A API não retornou uma resposta."
            );

        }


        /*
            Mostra resposta.
        */

        const bolha =
            addMessage(
                "assistant",
                ""
            );


        await typeWriter(
            bolha,
            answer.trim()
        );


        /*
            ==================================================
            MEMÓRIA — RESPOSTA
            ==================================================
        */

        memoriaConversa.adicionarMensagem(
            "assistant",
            answer.trim()
        );


        /*
            ==================================================
            RESUMO
            ==================================================
        */

        if (
            memoriaConversa.precisaResumir()
        ) {

            try {

                await memoriaConversa.gerarResumo(
                    GROQ_API_KEY,
                    GROQ_MODEL
                );

            } catch (
                erroMemoria
            ) {

                console.error(
                    "Erro ao gerar resumo:",
                    erroMemoria
                );

            }

        }


        status.textContent =
            "Online";


    } catch (
        error
    ) {


        console.error(
            "ERRO:",
            error
        );


        addMessage(

            "assistant",

            "Erro ao consultar a IA: " +
            error.message

        );


        status.textContent =
            "Erro";

    }


    sendBtn.disabled =
        false;


    questionInput.disabled =
        false;


    questionInput.focus();

}



/* ==========================================================
   BOTÃO
========================================================== */

sendBtn.addEventListener(
    "click",
    askQuestion
);



/* ==========================================================
   ENTER
========================================================== */

questionInput.addEventListener(

    "keydown",

    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            askQuestion();

        }

    }

);



/* ==========================================================
   INICIAR
========================================================== */

async function iniciar() {

    try {


        if (
            typeof carregarPersonagem !==
            "function"
        ) {

            throw new Error(
                "A função carregarPersonagem() não foi encontrada."
            );

        }


        await carregarPersonagem();


        status.textContent =
            "Online";


        console.log(
            "Tiago Digital iniciado."
        );


        console.log(
            "Personagem carregado:",
            personagem
        );


        console.log(
            "Memória:",
            memoriaConversa
        );


    } catch (
        error
    ) {


        console.error(
            "Erro ao carregar personagem:",
            error
        );


        status.textContent =
            "Erro ao carregar personagem";


        addMessage(

            "assistant",

            "Não consegui carregar personagem.json. Verifique se ele está na mesma pasta do index.html."

        );

    }

}



/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

iniciar();

</script>
