/* ==========================================================
   RESET
========================================================== */

* {

body {

/* ==========================================================

/* ==========================================================

.header {

.header-content {

.profile-info {

}

.profile-status {

.auth-button {

    border-radius: 8px;
    cursor: pointer;

}

.auth-button:hover {
    background: #f1f1f1;
}

.signup-button {
    background: #222;
    color: #ffffff;
    margin-left: 4px;
}

.signup-button:hover {
    background: #000000;
}

/* ==========================================================
   MENU
========================================================== */

.menu-container {
    position: relative;
    margin-left: 6px;
}

.menu-button {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 22px;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.menu-button:hover {
    background: #f1f1f1;
}

.dropdown-menu {
    position: absolute;
    right: 0;
    top: 44px;
    width: 190px;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    display: none;
    z-index: 50;
}

.dropdown-menu.active {
    display: block;
}

.dropdown-item {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    color: #222;
    font-size: 13px;
    cursor: pointer;
}

.dropdown-item:hover {
    background: #f3f3f3;
}

/* ==========================================================
   ÁREA DAS MENSAGENS
========================================================== */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 100px 20px 160px;
    scroll-behavior: smooth;
}

.message {
    max-width: 760px;

}

.message-content {

    word-break: break-word;
}

.message.user .message-content {
    order: 1;
    background: #f1f1f1;
    color: #222;
    padding: 10px 16px;
    border-radius: 18px;
    max-width: 70%;
    position: relative;
}

.message.user .message-content::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 13px;
    width: 10px;
    height: 10px;
    background: #f1f1f1;
    transform: rotate(45deg);
    border-radius: 2px;
}

.send-button:active {

.send-button:disabled {

/* ==========================================================
   STATUS DO PERSONAGEM
========================================================== */

.character-status {
    max-width: 760px;

    gap: 8px;

    color: #888;

/* ==========================================================

========================================================== */

.disclaimer {

/* ==========================================================

.messages::-webkit-scrollbar {

) {

/* ==========================================================
   NORMALIZAR TEXTO
========================================================== */

function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* ==========================================================
   ENCONTRAR CONTEXTOS RELEVANTES
========================================================== */

function getRelevantText(personagem, pergunta) {

    if (!personagem || !pergunta) {
        return "";
    }

    const perguntaNormalizada =
        normalizar(pergunta);

    const resultados = [];

    for (const [titulo, conteudo] of Object.entries(personagem)) {

      const secao = palavrasChave.find(
    section => section.name === titulo
);

const chaves = secao
    ? secao.keywords
    : [];

        let pontos = 0;

        for (const palavraChave of chaves) {

            const chaveNormalizada =
                normalizar(palavraChave);

            if (
                perguntaNormalizada
                    .includes(chaveNormalizada)
            ) {

                pontos += 10;

            }

        }

        /* Também considera o próprio título da seção */

        const tituloNormalizado =
            normalizar(titulo);

        if (
            perguntaNormalizada
                .includes(tituloNormalizado)
        ) {

            pontos += 20;

        }

        if (pontos > 0) {

            resultados.push({
                titulo,
                conteudo,
                pontos
            });

        }

    }


    /* ======================================================
       ORDENA PELOS CONTEXTOS MAIS RELEVANTES
    ====================================================== */

    resultados.sort(
        (a, b) => b.pontos - a.pontos
    );


    /* ======================================================
       ENVIA SOMENTE OS MELHORES CONTEXTOS
    ====================================================== */

    return resultados
        .slice(0, 3)
        .map(secao =>
            `### ${secao.titulo}\n${secao.conteudo}`
        )
        .join("\n\n");

}


      

/* ==========================================================
   INICIAR
   ========================================================== */

carregarPersonagem();

</script>
